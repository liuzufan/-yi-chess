}
// 寻找围棋围空位置
function rpFindGoExpandMove(myColor,phase){
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    if(goB[x][y]!==0)continue;
    var nearMy=false;
    for(var dx=-1;dx<=1&&!nearMy;dx++)for(var dy=-1;dy<=1;dy++){
      var nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<GSZ&&ny>=0&&ny<GSZ&&goB[nx][ny]===myColor)nearMy=true;
    }
    if(nearMy){
      var nearEdge=x<=2||x>=16||y<=2||y>=16;
      if(nearEdge && phase!=='收官'){
        var testR=goTry(goB,x,y,myColor,goKo);
        if(testR.valid)return {x:x,y:y};
      }
    }
  }
  return null;
}
// 象棋讲解
function rpXQComment(m, idx, phase, total){
  var moveNum=idx+1;
  var cmt='', suggest='';
  var pieceName=XC_H[m.piece]||'棋子';

  // 吃子
  if(m.captured && m.captured!==0){
    var capName=XC_H[m.captured]||'棋子';
    var capVal=XV[m.captured]||0;
    if(capVal>=900){
      cmt='<span class="rp-key">吃车！</span>斩获对方主力，战局天平倾斜';
    }else if(capVal>=400){
      cmt='<span class="rp-key">吃'+capName+'！</span>消灭对方大子，物质优势扩大';
    }else{
      cmt='吃掉对方'+capName+'，小有收获';
    }
  }else{
    // 将军检查
    var moverRed=xqRedP(m.piece);
    var oppRed=!moverRed;
    if(xqCheck(xqB, oppRed)){
      cmt='<span class="rp-key">将军！</span>迫使对方应将，掌握主动';
    }else{
      if(phase==='开局'){
        var openNames={12:'车出动抢占要道',5:'车出动控制沿线',11:'马跃要位蓄势待发',4:'马跃河道策应',6:'炮平中远程施压',13:'炮位调整伺机进攻',1:'帅坐中堂稳固后方',8:'将坐中堂稳固后方'};
        cmt=openNames[m.piece]||'开局出子，展开阵型';
      }else if(phase==='中盘'){
        var midNames={12:'车控要道',5:'车控要道',11:'马踩要位',4:'马踩要位',6:'炮瞄目标',13:'炮瞄目标',7:'兵过河威胁增大',14:'卒过河威胁增大'};
        cmt=midNames[m.piece]||'调兵遣将，争夺要地';
        // 检查是否过河
        var crossedRiver=moverRed?(m.tr<5):(m.tr>4);
        if(crossedRiver && (m.piece===7||m.piece===14)){
          cmt='<span class="rp-key">过河兵！</span>威胁对方腹地，价值倍增';
        }
      }else{
        cmt='残局阶段，'+pieceName+'调动';
      }
    }
  }

  // 人类着法建议: 全面评估局面，防守优先，绝杀检测
  if(rpIsHumanMove(idx) && !(m.captured && m.captured!==0)){
    var moverRed2=xqRedP(m.piece);
    var playerIsRed2=replayData.playerFirst;
    // 象棋绝杀检测: 如果玩家被将军且无解，不给建议
    var inCheckNow=xqCheck(xqB, playerIsRed2);
    if(inCheckNow){
      // 检查是否有合法走法能解将
      var allEscape=xqLegalMoves(xqB, playerIsRed2);
      var canEscape=false;
      for(var ei=0;ei<allEscape.length;ei++){
        var em=allEscape[ei];
        var ep=xqB[em.fr][em.fc];
        var ec=xqB[em.tr][em.tc];
        xqB[em.tr][em.tc]=ep;xqB[em.fr][em.fc]=0;
        if(!xqCheck(xqB, playerIsRed2))canEscape=true;
        xqB[em.fr][em.fc]=ep;xqB[em.tr][em.tc]=ec;
        if(canEscape)break;
      }
      if(!canEscape){
        // 将死! 不给建议
        suggest=null;
      }else{
        var bestCapture=rpFindBetterXQMove(playerIsRed2, m);
        if(bestCapture) suggest=bestCapture;
      }
    }else{
      // 检查对方是否威胁多个大子(无法全部保护)
      var threatCount=0;
      var allOppMoves=xqLegalMoves(xqB, !playerIsRed2);
      var threatenedPieces={};
      for(var ti=0;ti<allOppMoves.length;ti++){
        var tm=allOppMoves[ti];
        if(tm.captured&&tm.captured!==0){
          var tval=XV[tm.captured]||0;
          if(tval>=400 && !threatenedPieces[tm.tr+','+tm.tc]){
            threatenedPieces[tm.tr+','+tm.tc]=1;
            threatCount++;
          }
        }
      }
      if(threatCount>=2){
        // 多子受威胁，检查能否同时保护
        var canProtectAll=false;
        var myMoves=xqLegalMoves(xqB, playerIsRed2);
        for(var mi=0;mi<myMoves.length;mi++){
          var mm=myMoves[mi];
          var mp=xqB[mm.fr][mm.fc];
          var mc=xqB[mm.tr][mm.tc];
          xqB[mm.tr][mm.tc]=mp;xqB[mm.fr][mm.fc]=0;
          // 检查走棋后还有多少大子被威胁
          var remainingThreats=0;
          var oppReplies=xqLegalMoves(xqB, !playerIsRed2);
          var tp2={};
          for(var ri=0;ri<oppReplies.length;ri++){
            var rm=oppReplies[ri];
            if(rm.captured&&rm.captured!==0){
              var rval=XV[rm.captured]||0;
              if(rval>=400 && !tp2[rm.tr+','+rm.tc]){
                tp2[rm.tr+','+rm.tc]=1;
                remainingThreats++;
              }
            }
          }
          xqB[mm.fr][mm.fc]=mp;xqB[mm.tr][mm.tc]=mc;
          if(remainingThreats===0){canProtectAll=true;break}
        }
        if(!canProtectAll){
          // 绝杀: 多子受威胁无法全保，不给建议
          suggest=null;
        }else{
          var bestCapture2=rpFindBetterXQMove(playerIsRed2, m);
          if(bestCapture2) suggest=bestCapture2;
        }
      }else{
        var bestCapture3=rpFindBetterXQMove(playerIsRed2, m);
        if(bestCapture3){
          suggest=bestCapture3;
        }else if(phase==='中盘'){
          var pieceVal=XV[m.piece]||0;
          if(pieceVal>=400 && Math.abs(m.tr-m.fr)<=1 && Math.abs(m.tc-m.fc)<=1){
            suggest={text:'AI建议：大子仅微调一步，未能发挥进攻潜力。中盘阶段应主动出击，用车马炮配合攻击对方薄弱环节，或抢占要道控制局势，而非消极调整', verified:true};
          }
        }
      }
    }
  }

  return {cmt: cmt, suggest: suggest};
}
// 象棋AI建议: 全面评估局面，防守优先原则
// 核心逻辑:
//   1. 撤销玩家走棋，检查对方在走棋前是否将军或威胁大子
//   2. 如果对方在将军 -> 必须应将，玩家走棋若已应将则正确，不给进攻建议
//   3. 如果对方威胁己方大子(下一手可吃) -> 玩家走棋若在保护/逃跑则正确
//   4. 如果无威胁 -> 检查是否有更好的吃子机会
function rpFindBetterXQMove(playerIsRed, curMove){
  // 保存当前棋盘状态(包含玩家走棋后的状态)
  var savedBoard=[];
  for(var i=0;i<xqB.length;i++)savedBoard.push(xqB[i].slice());

  // 撤销玩家走棋: 把棋子移回原位，恢复被吃的子
  if(curMove){
    var movedPiece=xqB[curMove.tr][curMove.tc];
    xqB[curMove.fr][curMove.fc]=movedPiece;
    xqB[curMove.tr][curMove.tc]=(curMove.captured&&curMove.captured!==0)?curMove.captured:0;
  }

  var result=null;

  // 1. 检查对方是否在将军(玩家走棋前的棋盘上)
  var inCheck=xqCheck(xqB, playerIsRed);
  if(inCheck){
    // 对方在将军！玩家必须应将
    // 检查玩家实际走棋是否化解了将军
    // 恢复棋盘到走棋后状态检查
    xqB=savedBoard.map(function(r){return r.slice()});
    var stillInCheck=xqCheck(xqB, playerIsRed);
    if(!stillInCheck){
      // 玩家成功应将，正确！不给进攻建议
      return null;
    }
    // 玩家没应将(不应该发生，但防御性处理)
    // 找最佳应将方式
    xqB=savedBoard.map(function(r){return r.slice()});
    // 重新撤销走棋
    if(curMove){
      var mp=xqB[curMove.tr][curMove.tc];
      xqB[curMove.fr][curMove.fc]=mp;
      xqB[curMove.tr][curMove.tc]=(curMove.captured&&curMove.captured!==0)?curMove.captured:0;
    }
    var escapeMove=rpFindXQCheckEscape(playerIsRed);
    if(escapeMove){
      result={text:'AI建议走'+escapeMove.desc+'。理由：对方正在将军，必须立即应将化解！你实际走法未能解除将军威胁。此处是最佳应将方式', x:escapeMove.tc, y:escapeMove.tr, isOpp:false, xq:true, fromX:escapeMove.fc, fromY:escapeMove.fr};
    }
    xqB=savedBoard;
    return result;
  }

  // 2. 检查对方是否威胁己方大子(下一手可吃车马炮)
  var threatenedPiece=rpScanXQThreat(playerIsRed);
  if(threatenedPiece){
    // 对方威胁己方大子，检查玩家走棋是否在应对
    // 恢复棋盘检查走棋后威胁是否解除
    xqB=savedBoard.map(function(r){return r.slice()});
    var threatAfter=rpScanXQThreat(playerIsRed);
    if(!threatAfter){
      // 玩家成功保护/移走了受威胁的棋子，正确！
      return null;
    }
    // 玩家没应对威胁，建议保护或逃跑
    xqB=savedBoard.map(function(r){return r.slice()});
    if(curMove){
      var mp2=xqB[curMove.tr][curMove.tc];
      xqB[curMove.fr][curMove.fc]=mp2;
      xqB[curMove.tr][curMove.tc]=(curMove.captured&&curMove.captured!==0)?curMove.captured:0;
    }
    var protectMove=rpFindXQProtectMove(playerIsRed, threatenedPiece);
    if(protectMove){
      result={text:'AI建议走'+protectMove.desc+'。理由：己方'+XC_H[threatenedPiece.piece]+'正受到对方威胁，若不处理下一手将被吃。你实际走法未保护受威胁棋子。应优先移走或保护大子，避免物质损失', x:protectMove.tc, y:protectMove.tr, isOpp:false, xq:true, fromX:protectMove.fc, fromY:protectMove.fr};
    }
    xqB=savedBoard;
    return result;
  }

  // 3. 无威胁，检查是否有更好的吃子机会
  var bestMove=null, bestVal=0;
  var allMoves=xqLegalMoves(xqB,playerIsRed);
  for(var i2=0;i2<allMoves.length;i2++){
    var mv=allMoves[i2];
    if(curMove && mv.fr===curMove.fr && mv.fc===curMove.fc && mv.tr===curMove.tr && mv.tc===curMove.tc)continue;
    if(mv.captured && mv.captured!==0){
      var capVal=XV[mv.captured]||0;
      var piece=xqB[mv.fr][mv.fc];
      var myVal=XV[piece]||0;
      xqB[mv.tr][mv.tc]=piece;xqB[mv.fr][mv.fc]=0;
      var canBeRecaptured=xqCanCapture(xqB,!playerIsRed,mv.tr,mv.tc);
      xqB[mv.fr][mv.fc]=piece;xqB[mv.tr][mv.tc]=mv.captured;
      var netGain=canBeRecaptured?(capVal-myVal):capVal;
      if(netGain>bestVal){
        bestVal=netGain;
        var col='abcdefghi';
        var reason=canBeRecaptured?('净赚'+(capVal-myVal)+'分，但需注意对方可反吃'):(('净赚'+capVal+'分，且不会被反吃，稳赚不赔'));
        bestMove={text:'AI建议走'+XC_H[piece]+'('+col[mv.fc]+(10-mv.fr)+'→'+col[mv.tc]+(10-mv.tr)+')吃对方'+XC_H[mv.captured]+'。理由：'+reason+'。你实际走法未抓住吃子机会，让对方大子逃脱', x:mv.tc, y:mv.tr, isOpp:false, xq:true, fromX:mv.fc, fromY:mv.fr};
      }
    }
  }

  // 恢复棋盘
  xqB=savedBoard;
  return bestMove;
}
// 扫描象棋对方对己方大子的威胁
function rpScanXQThreat(playerIsRed){
  // 检查对方下一步能吃己方哪些大子(车马炮)
  var allOppMoves=xqLegalMoves(xqB,!playerIsRed);
  for(var i=0;i<allOppMoves.length;i++){
    var mv=allOppMoves[i];
    if(mv.captured && mv.captured!==0){
      var val=XV[mv.captured]||0;
      if(val>=400){ // 车(900) 马(400) 炮(450)
        return {piece:mv.captured, x:mv.tc, y:mv.tr};
      }
    }
  }
  return null;
}
// 寻找象棋应将方式
function rpFindXQCheckEscape(playerIsRed){
  var allMoves=xqLegalMoves(xqB,playerIsRed);
  for(var i=0;i<allMoves.length;i++){
    var mv=allMoves[i];
    var piece=xqB[mv.fr][mv.fc];
    var cap=xqB[mv.tr][mv.tc];
    xqB[mv.tr][mv.tc]=piece;xqB[mv.fr][mv.fc]=0;
    var stillCheck=xqCheck(xqB,playerIsRed);
    xqB[mv.fr][mv.fc]=piece;xqB[mv.tr][mv.tc]=cap;
    if(!stillCheck){
      var col='abcdefghi';
      return {fr:mv.fr,fc:mv.fc,tr:mv.tr,tc:mv.tc,desc:XC_H[piece]+'('+col[mv.fc]+(10-mv.fr)+'→'+col[mv.tc]+(10-mv.tr)+')'};
    }
  }
  return null;
}
// 寻找象棋保护/移走受威胁棋子的走法
function rpFindXQProtectMove(playerIsRed, threat){
  var allMoves=xqLegalMoves(xqB,playerIsRed);
  for(var i=0;i<allMoves.length;i++){
    var mv=allMoves[i];
    // 检查走棋后威胁是否解除
    var piece=xqB[mv.fr][mv.fc];
    var cap=xqB[mv.tr][mv.tc];
    xqB[mv.tr][mv.tc]=piece;xqB[mv.fr][mv.fc]=0;
    var threatAfter=rpScanXQThreat(playerIsRed);
    xqB[mv.fr][mv.fc]=piece;xqB[mv.tr][mv.tc]=cap;
    if(!threatAfter){
      var col='abcdefghi';
      return {fr:mv.fr,fc:mv.fc,tr:mv.tr,tc:mv.tc,desc:XC_H[piece]+'('+col[mv.fc]+(10-mv.fr)+'→'+col[mv.tc]+(10-mv.tr)+')'};
    }
  }
  return null;
}
// 检查象棋某位置是否可以被对方吃
function xqCanCapture(board, attackerRed, tr, tc){
  var moves=xqLegalMoves(board,attackerRed);
  for(var i=0;i<moves.length;i++){
    if(moves[i].tr===tr&&moves[i].tc===tc)return true;
  }
  return false;
}
function rpApplyMove(idx){

    xqB[m.tr][m.tc]=xqB[m.fr][m.fc];xqB[m.fr][m.fc]=0;

  }
  rpShowComment(idx,goCaptured);

  }
}

function exit(){
  // 中断所有AI计算
  goAbort=true;gAbort=true;xqAbort=true;goAi=false;gAiThink=false;xqAi=false;
  xqSearchGen++;gGen++; // 使所有旧异步搜索链失效
  pendingDiff=null;
  goH=null;
  // 清理回放定时器
  if(replayTimer){clearTimeout(replayTimer);replayTimer=null}
  if(rpSuggestTimer){clearInterval(rpSuggestTimer);rpSuggestTimer=null}
  $('entry').style.display='flex';
  $('game').classList.remove('active');
}
// === 快捷键支持 ===
document.addEventListener('keydown',function(e){
  // 输入框聚焦时不触发快捷键
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable))return;
  // 只在游戏界面激活且无弹窗时响应
  if(!$('game').classList.contains('active'))return;
  if(document.querySelector('.modal.show,.rp-modal.show,.rp-viewer.show'))return;
  // Ctrl+Z: 悔棋
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault();
    var ub=$('ubtn');
    if(ub&&ub.style.display!=='none'&&!ub.disabled&&ub.onclick)ub.onclick();
    return;
  }
  // Esc: 退出（弹窗打开时只关弹窗）
  if(e.key==='Escape'){
    e.preventDefault();
    var mm=document.querySelector('.modal.show');
    if(mm){mm.classList.remove('show');return}
    var rm=document.querySelector('.rp-viewer.show');
    if(rm){if(typeof closeRPViewer==='function')closeRPViewer();return}
    exit();return;
  }
  // 空格: 围棋停一手
  if(e.key===' '&&curGame==='go'){
    e.preventDefault();
    var gb=$('gpbtn');
    if(gb&&gb.style.display!=='none'&&!goOver&&!goAi&&gb.onclick)gb.onclick();
    return;
  }
  // R: 重开（需双击R或长按，防误触：仅对局非空时）
  if((e.key==='r'||e.key==='R')&&!e.ctrlKey&&!e.altKey){
    e.preventDefault();
    if(typeof lastRKick==='undefined')lastRKick=0;
    if(Date.now()-lastRKick<600){$('rbtn').onclick();lastRKick=0}
    else lastRKick=Date.now();
    return;
  }
});
var lastRKick=0;

}

  s.getContext('2d').drawImage(cv,0,0);
  return s;
}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function easeOutBack(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
// 重力落子曲线: 模拟自由落体+轻微弹跳,比easeOutBack更自然
function easeDrop(t){
  if(t<0.6){var p=t/0.6;return 1-(1-p)*(1-p)} // 前60%加速下落
  if(t<0.8){var p2=(t-0.6)/0.2;return 1+0.04*(1-p2)*Math.sin(p2*Math.PI)} // 落地微弹
  var p3=(t-0.8)/0.2;return 1+0.012*(1-p3)*Math.sin(p3*Math.PI*1.5)} // 二次微颤
// 触发落子动画 kind: 'drop'下落(五子/围棋) 'slide'滑动(象棋)
function addPlaceAnim(opts){
  placeAnims.push({
    kind:opts.kind||'drop',
    fx:opts.fx,fy:opts.fy,tx:opts.tx,ty:opts.ty,
    r:opts.r,piece:opts.piece,black:opts.black,
    dur:opts.kind==='slide'?240:280,
    start:performance.now(),
    snapshot:opts.snapshot||null
  });
  if(animRAFId===null)animRAFId=requestAnimationFrame(stepPlaceAnims);
}
function stepPlaceAnims(){
  var now=performance.now();
  // 恢复背景快照(消除上一帧残影)
  var snap=placeAnims.length>0?placeAnims[0].snapshot:null;
  if(snap)cx.drawImage(snap,0,0);
  var alive=[],landed=true;
  for(var i=0;i<placeAnims.length;i++){
    var a=placeAnims[i];
    var t=Math.min(1,(now-a.start)/a.dur);
    if(t<1)landed=false;
    if(t<1||now-a.start<a.dur+300){alive.push(a)}
    // 计算动画位置
    var px,py,scale=1;
    if(a.kind==='slide'){
      var et=easeOutCubic(t);
      px=a.fx+(a.tx-a.fx)*et;
      py=a.fy+(a.ty-a.fy)*et;
    }else{
      var et2=easeDrop(t);
      px=a.tx;
      var dropDist=38;
      py=a.ty-(1-et2)*dropDist;
      // 缩放: 起始1.08→落地时轻微压扁→恢复
      if(t<0.6){scale=1.0+0.08*(1-t/0.6)}
      else if(t<0.8){var squash=1-Math.sin((t-0.6)/0.2*Math.PI)*0.06;scale=squash}
      else{scale=1}
      if(t>=1){py=a.ty;scale=1}
    }
    // 落地阴影(从高处到低处逐渐变深变大)
    if(a.kind!=='slide'){
      var shadowProgress=Math.min(1,t*1.4);
      var shadowAlpha=0.08+shadowProgress*0.12;
      var shadowW=(a.r||22)*(0.6+shadowProgress*0.4);
      var shadowH=(a.r||22)*(0.2+shadowProgress*0.15);
      var shadowY=a.ty+(a.r||22)*0.6;
      cx.save();
      cx.globalAlpha=shadowAlpha*(t<1?1:Math.max(0,1-(t-1)/0.3));
      cx.fillStyle='rgba(30,20,10,1)';
      cx.beginPath();cx.ellipse(a.tx,shadowY,shadowW,shadowH,0,0,Math.PI*2);cx.fill();
      cx.restore();
    }
    // 绘制此动画棋子
    if(a.piece)drawXQP(px,py,a.piece);
    else drawBall(px,py,a.r*scale,a.black);
    // 落地涟漪(更柔和的双环)
    if(t>=0.85){
      var rt=(now-a.start-a.dur*0.85)/350;
      if(rt>=0&&rt<1){
        var ri=a.r||22;
        var fadeOut=1-rt;
        cx.save();
        // 外环
        cx.globalAlpha=fadeOut*0.35;
        cx.strokeStyle=(a.black===false)?'rgba(90,150,90,1)':'rgba(180,120,50,1)';
        cx.lineWidth=1.8*fadeOut+0.3;
        cx.beginPath();cx.ellipse(a.tx,a.ty,ri*(1+rt*2.0),ri*(0.5+rt*1.0),0,0,Math.PI*2);cx.stroke();
        // 内环(稍慢)
        if(rt>0.05){
          var rt2=rt-0.05;
          cx.globalAlpha=fadeOut*0.2;
          cx.lineWidth=1.2*fadeOut+0.2;
          cx.beginPath();cx.ellipse(a.tx,a.ty,ri*(1+rt2*1.4),ri*(0.45+rt2*0.7),0,0,Math.PI*2);cx.stroke();
        }
        cx.restore();
      }
    }
  }
  placeAnims=alive;
  // 所有棋子已落地: 立即执行回调(如AI启动) — 涟漪继续播,异步AI搜索与渲染并行
  if(landed&&animDoneCbs.length>0){
    var cbs0=animDoneCbs;animDoneCbs=[];
    for(var ci0=0;ci0<cbs0.length;ci0++){
      try{cbs0[ci0]()}catch(e){console.error('anim callback error:',e)}
    }
  }
  if(placeAnims.length>0){
    animRAFId=requestAnimationFrame(stepPlaceAnims);
  }else{
    animRAFId=null;
    // 动画全部结束: 完整重绘一次(消除残影,恢复last标记)
    if(curGame==='gomoku')drawGomoku();
    else if(curGame==='go')drawGo();
    else if(curGame==='xq')drawXQ();
  }
}

// 将军警示脉冲(王位红环扩散) — 每帧快照恢复,防止红环叠加残留
function animCheckPulse(kr,kc){

  function pulse(){
    // 有落子动画进行时先让位,动画结束后再播放将军脉冲(避免掉帧/旧快照覆盖新动画)

    var t=(performance.now()-t0)/700;

    cx.restore();

  }

}

// 画棋子球体 — 增强质感：多层渐变+高光+边缘反射
function drawBall(px,py,r,black){

  }else{
    g.addColorStop(0,'#ffffff');g.addColorStop(.15,'#fcf8f0');g.addColorStop(.4,'#f5ede0');g.addColorStop(.7,'#e8dcc8');g.addColorStop(.9,'#d0c0a0');g.addColorStop(1,'#b8a888');
  }

  var hg=cx.createRadialGradient(px-r*.32,py-r*.32,0,px-r*.32,py-r*.32,r*.65);
  if(black){hg.addColorStop(0,'rgba(255,255,255,.22)');hg.addColorStop(.5,'rgba(255,255,255,.05)');hg.addColorStop(1,'rgba(255,255,255,0)')}
  else{hg.addColorStop(0,'rgba(255,255,255,.85)');hg.addColorStop(.4,'rgba(255,255,255,.3)');hg.addColorStop(1,'rgba(255,255,255,0)')}

  // 高光层2：锐利小亮点

  if(black){sg.addColorStop(0,'rgba(255,255,255,.2)');sg.addColorStop(1,'rgba(255,255,255,0)')}
  else{sg.addColorStop(0,'rgba(255,255,255,.95)');sg.addColorStop(1,'rgba(255,255,255,0)')}
  cx.fillStyle=sg;cx.beginPath();cx.ellipse(px-r*.28,py-r*.28,r*.25,r*.2,-0.3,0,Math.PI*2);cx.fill();
  cx.restore();
  // 底部反射光
  cx.save();cx.globalAlpha=black?.12:.2;
  var bg=cx.createRadialGradient(px+r*.2,py+r*.3,0,px+r*.2,py+r*.3,r*.5);
  if(black){bg.addColorStop(0,'rgba(100,100,100,.5)');bg.addColorStop(1,'rgba(0,0,0,0)')}
  else{bg.addColorStop(0,'rgba(200,180,150,.5)');bg.addColorStop(1,'rgba(255,255,255,0)')}

// 落子预览：半透明、与棋子颜色对应的高亮(修复黑白预览均显示黑色投影、难以区分的配色缺陷)

// 木纹纹理缓存（离屏Canvas，避免每次重绘时Math.random导致纹理跳动）
var _paperCache={};
function makeWoodTexture(w,h,seed){
  var key=w+'_'+h;
  if(_paperCache[key])return _paperCache[key];
  var oc=document.createElement('canvas');oc.width=w;oc.height=h;
  var ox=oc.getContext('2d');
  // 使用种子伪随机，保证纹理固定
  var s=seed||12345;
  function rng(){s=(s*9301+49297)%233280;return s/233280}
  // 底色渐变
  var g=ox.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.72);
  g.addColorStop(0,'#e8cc94');g.addColorStop(.35,'#dab87a');g.addColorStop(.7,'#c8a460');g.addColorStop(1,'#a8843c');
  ox.fillStyle=g;ox.fillRect(0,0,w,h);
  // 木纹层1：粗木纹波纹
  ox.save();ox.globalAlpha=.14;
  for(var i=0;i<35;i++){
    ox.strokeStyle=i%2===0?'#8b5e3c':'#6b4226';ox.lineWidth=.5+rng()*1.2;
    ox.beginPath();var y=(i/35)*h+rng()*8;
    ox.moveTo(0,y);ox.bezierCurveTo(w*.25,y+(rng()-.5)*20,w*.5,y+(rng()-.5)*20,w*.75,y+(rng()-.5)*15);
    ox.bezierCurveTo(w*.85,y+(rng()-.5)*12,w*.95,y+(rng()-.5)*8,w,y+(rng()-.5)*5);
    ox.stroke();
  }
  ox.restore();
  // 木纹层2：深色细纹
  ox.save();ox.globalAlpha=.08;
  for(var i=0;i<20;i++){
    ox.strokeStyle='#5a3a1a';ox.lineWidth=.3+rng()*.4;
    ox.beginPath();var y=rng()*h;
    ox.moveTo(0,y);ox.bezierCurveTo(w*.3,y+(rng()-.5)*12,w*.6,y+(rng()-.5)*12,w,y+(rng()-.5)*8);
    ox.stroke();
  }
  ox.restore();
  // 木纹层3：颗粒
  ox.save();ox.globalAlpha=.06;
  for(var i=0;i<120;i++){ox.fillStyle=i%3===0?'#8b6914':'#6b4f10';ox.fillRect(rng()*w,rng()*h,rng()*2+.3,rng()*2+.3)}
  ox.restore();
  // 四角暗角
  ox.save();ox.globalAlpha=.15;
  var vg=ox.createRadialGradient(w/2,h/2,w*.25,w/2,h/2,w*.7);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(50,30,5,.7)');
  ox.fillStyle=vg;ox.fillRect(0,0,w,h);
  ox.restore();
  _paperCache[key]=oc;
  return oc;
}
function drawPaper(w,h){

  cx.drawImage(tex,0,0);
}

// canvas事件
var evDone=false;
function setupEv(){
  if(evDone)return;evDone=true;
  var c=$('bd');
  function getXY(e){
    var r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;
    var mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
    return{mx:mx,my:my};
  }
  c.addEventListener('click',function(e){var p=getXY(e);handleClick(p.mx,p.my)});
  c.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];var r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;handleClick((t.clientX-r.left)*sx,(t.clientY-r.top)*sy)},false);
  var hx=-1,hy=-1;
  c.addEventListener('mousemove',function(e){
    if(over)return;
    var p=getXY(e);
    var playerColor=playerFirst?1:2;
    if(curGame==='gomoku'&&!gAiThink&&gCur===playerColor&&placeAnims.length===0){
      var x=Math.round((p.mx-GP)/GC),y=Math.round((p.my-GP)/GC);
      if(x!==hx||y!==hy){hx=x;hy=y;

      }
    }else if(curGame==='go'&&!goOver&&!goAi&&goCur===playerColor&&placeAnims.length===0){
      var gx=Math.round((p.mx-GOP)/GOC),gy=Math.round((p.my-GOP)/GOC);
      if(gx>=0&&gx<GSZ&&gy>=0&&gy<GSZ&&goB[gx][gy]===0){if(!goH||goH.x!==gx||goH.y!==gy){goH={x:gx,y:gy};drawGo()}}
    }
  });
  c.addEventListener('mouseleave',function(){hx=-1;hy=-1;if(placeAnims.length>0)return;if(curGame==='gomoku'&&!over)drawGomoku();if(curGame==='go'){goH=null;drawGo()}});
}
function handleClick(mx,my){

  else if(curGame==='xq'){var cd=Math.round((mx-XP)/XC),rd=Math.round((my-XP)/XC);if(rd>=0&&rd<10&&cd>=0&&cd<9)xqPlay(xqInvR(rd),xqInvC(cd))}
}

// ============================================================
//  五子棋 (15x15) — VCF/VCT + 威胁搜索 + 迭代加深Alpha-Beta
//  棋型评估: 七大棋型含跳子模式, 26种开局定式
// ============================================================
var GS=15,GC=36,GP=28,GR=15,GX=GC*(GS-1)+GP*2;
var gB,gH,gCur,gAiThink,gLast,gTT,gNodes,gStart,gAbort,gTTSize=200003,gKiller,gHistory,gTimeLimit=5000,gGen=0;

// 棋型评分表
var PAT_SCORE={
  FIVE:10000000,     // 连五
  LIVE_FOUR:1000000, // 活四
  RUSH_FOUR:100000,  // 冲四(含跳冲四)
  LIVE_THREE:10000,  // 活三(含跳活三)
  SLEEP_THREE:1000,  // 眠三
  LIVE_TWO:100,      // 活二(含跳活二)
  SLEEP_TWO:10,      // 眠二
  LIVE_ONE:1,        // 活一
  SLEEP_ONE:0        // 眠一
};

// 提取一条线上的棋型编码 (以p为放置点, 方向dx,dy)
// 返回: 以落子点为中心,前后各取4格的编码字符串
// 编码: 1=己方, 2=对方, 0=空, 边界视为对方
function gLineStr(b,x,y,p,dx,dy){
  var s='';
  for(var i=-4;i<=4;i++){
    var nx=x+dx*i,ny=y+dy*i;
    if(i===0){s+='1';continue}
    if(nx<0||nx>=GS||ny<0||ny>=GS){s+='2';continue}
    var v=b[ny][nx];
    if(v===0)s+='0';
    else if(v===p)s+='1';
    else s+='2';
  }
  return s;
}

// 检测中心点(位置4)的棋型 — 结果缓存(评估热点,命中率高,提速10倍+)
var gPatCache={};
function gPattern(s){
  var c=gPatCache[s];
  if(c!==undefined)return c;
  var r=gPatternRaw(s);
  gPatCache[s]=r;
  return r;
}
function gPatternRaw(s){
  // s长度9, 中心为s[4]='1'
  // 检查各种棋型
  // 连五
  if(s.indexOf('11111')>=0)return'FIVE';
  // 活四: 011110
  if(s.indexOf('011110')>=0)return'LIVE_FOUR';
  // 冲四: 011112, 211110, 11110(边), 01111(边), 11011, 10111, 11101
  if(/[2]11110/.test(s)||/01111[2]/.test(s))return'RUSH_FOUR';
  if(s.indexOf('11011')>=0||s.indexOf('11101')>=0||s.indexOf('10111')>=0)return'RUSH_FOUR';
  if(/^[2]1111/.test(s)||/1111[2]$/.test(s))return'SLEEP_THREE';
  // 活三: 011100, 001110, 010110, 011010
  if(s.indexOf('011100')>=0||s.indexOf('001110')>=0)return'LIVE_THREE';
  if(s.indexOf('010110')>=0||s.indexOf('011010')>=0)return'LIVE_THREE';
  // 眠三: 001112, 010112, 011012, 211100, 211010, 210110, 10011, 11001, 10101
  if(/[2]11100/.test(s)||/00111[2]/.test(s))return'SLEEP_THREE';
  if(/[2]10110/.test(s)||/01101[2]/.test(s))return'SLEEP_THREE';
  if(/[2]11010/.test(s)||/01011[2]/.test(s))return'SLEEP_THREE';
  if(s.indexOf('10011')>=0||s.indexOf('11001')>=0||s.indexOf('10101')>=0)return'SLEEP_THREE';
  if(/^[2]1110/.test(s)||/0111[2]$/.test(s))return'SLEEP_THREE';
  // 活二: 001100, 010100, 001010, 010010
  if(s.indexOf('001100')>=0||s.indexOf('010100')>=0)return'LIVE_TWO';
  if(s.indexOf('001010')>=0||s.indexOf('010010')>=0)return'LIVE_TWO';
  // 眠二: 001102, 010012, 201100, 210100, 10001
  if(/[2]01100/.test(s)||/00110[2]/.test(s))return'SLEEP_TWO';
  if(/[2]10100/.test(s)||/00101[2]/.test(s))return'SLEEP_TWO';
  if(s.indexOf('10001')>=0)return'SLEEP_TWO';
  // 活一
  if(s.indexOf('00100')>=0||s.indexOf('01000')>=0||s.indexOf('00010')>=0)return'LIVE_ONE';
  return null;
}

// 评估一个点在4个方向上的棋型总分
function gEvalPt(b,x,y,p){
  var D=[[1,0],[0,1],[1,1],[1,-1]];
  var total=0;
  var patterns={FIVE:0,LIVE_FOUR:0,RUSH_FOUR:0,LIVE_THREE:0,SLEEP_THREE:0,LIVE_TWO:0,SLEEP_TWO:0,LIVE_ONE:0};
  for(var d=0;d<4;d++){
    var s=gLineStr(b,x,y,p,D[d][0],D[d][1]);
    var pat=gPattern(s);
    if(pat){patterns[pat]++;total+=PAT_SCORE[pat]}
  }
  // 组合威胁加成
  if(patterns.FIVE>0)return PAT_SCORE.FIVE;
  if(patterns.LIVE_FOUR>0||patterns.RUSH_FOUR>=2)return PAT_SCORE.LIVE_FOUR;
  if(patterns.RUSH_FOUR>0&&patterns.LIVE_THREE>0)return PAT_SCORE.LIVE_FOUR;
  if(patterns.LIVE_THREE>=2)return PAT_SCORE.LIVE_THREE*2;
  return total;
}

// 获取棋型统计(用于决策)
function gPatCount(b,x,y,p){
  var D=[[1,0],[0,1],[1,1],[1,-1]];
  var pc={FIVE:0,LIVE_FOUR:0,RUSH_FOUR:0,LIVE_THREE:0,SLEEP_THREE:0,LIVE_TWO:0,SLEEP_TWO:0};
  for(var d=0;d<4;d++){
    var s=gLineStr(b,x,y,p,D[d][0],D[d][1]);
    var pat=gPattern(s);
    if(pat&&pc[pat]!==undefined)pc[pat]++;
  }
  return pc;
}

// ============================================================
//  行级增量评估 (性能核心): 棋盘评分 = 所有行评分之和
//  make/unmake 只重算过点的4条线(~8次行评分), 叶子评估O(1)
//  代替原来的全盘逐子重算, 叶子评估提速10-20倍
// ============================================================
var gLines=[],gCellLine=null,gLSc=null,gTot=[0,0],gLScCache={};
(function(){
  var i,k,c;
  for(var y=0;y<GS;y++){c=[];for(var x=0;x<GS;x++)c.push(y*GS+x);gLines.push(c)}
  for(var x2=0;x2<GS;x2++){c=[];for(var y2=0;y2<GS;y2++)c.push(y2*GS+x2);gLines.push(c)}
  for(var d=-(GS-5);d<=GS-5;d++){ // 主对角线 x-y=d
    c=[];
    for(var x3=Math.max(0,d);x3<Math.min(GS,GS+d);x3++)c.push((x3-d)*GS+x3);
    gLines.push(c);
  }
  for(var kk=4;kk<=2*(GS-1)-4;kk++){ // 反对角线 x+y=k
    c=[];
    for(var x4=Math.max(0,kk-GS+1);x4<=Math.min(GS-1,kk);x4++)c.push((kk-x4)*GS+x4);
    gLines.push(c);
  }
  gCellLine=new Array(GS*GS);
  for(i=0;i<GS*GS;i++)gCellLine[i]=[];
  for(i=0;i<gLines.length;i++){
    var cells=gLines[i];
    for(k=0;k<cells.length;k++)gCellLine[cells[k]].push(i);
  }
  gLSc=new Float64Array(gLines.length*2);
})();
function gSubCnt(s,sub){
  var cnt=0,idx=s.indexOf(sub);
  while(idx>=0){cnt++;idx=s.indexOf(sub,idx+1)}
  return cnt;
}
// 单行评分: 连子段(活/眠)+跳子棋型, 结果缓存
function gLineScoreStr(s){
  var c=gLScCache[s];
  if(c!==undefined)return c;
  var n=s.length,sc=0,i=0;
  while(i<n){
    if(s.charCodeAt(i)!==49){i++;continue}
    var j=i;
    while(j<n&&s.charCodeAt(j)===49)j++;
    var run=j-i;
    var L=i>0?s[i-1]:'2',R=j<n?s[j]:'2';
    var LL=i>1?s[i-2]:'2',RR=j<n-1?s[j+1]:'2';
    if(run>=5)sc+=PAT_SCORE.FIVE;
    else if(run===4){
      if(L==='0'&&R==='0')sc+=PAT_SCORE.LIVE_FOUR;
      else if(L==='0'||R==='0')sc+=PAT_SCORE.RUSH_FOUR;
    }else if(run===3){
      if(L==='0'&&R==='0'&&(LL==='0'||RR==='0'))sc+=PAT_SCORE.LIVE_THREE;
      else if(L==='0'||R==='0')sc+=PAT_SCORE.SLEEP_THREE;
    }else if(run===2){
      if(L==='0'&&R==='0'&&(LL==='0'||RR==='0'))sc+=PAT_SCORE.LIVE_TWO;
      else if(L==='0'||R==='0')sc+=PAT_SCORE.SLEEP_TWO;
    }else if(L==='0'&&R==='0')sc+=PAT_SCORE.LIVE_ONE;
    i=j;
  }
  sc+=gSubCnt(s,'11011')*PAT_SCORE.RUSH_FOUR;   // 跳冲四
  sc+=gSubCnt(s,'10111')*PAT_SCORE.RUSH_FOUR;
  sc+=gSubCnt(s,'11101')*PAT_SCORE.RUSH_FOUR;
  sc+=gSubCnt(s,'010110')*PAT_SCORE.LIVE_THREE; // 跳活三
  sc+=gSubCnt(s,'011010')*PAT_SCORE.LIVE_THREE;
  sc+=gSubCnt(s,'10011')*PAT_SCORE.SLEEP_THREE;
  sc+=gSubCnt(s,'11001')*PAT_SCORE.SLEEP_THREE;
  sc+=gSubCnt(s,'10101')*PAT_SCORE.SLEEP_THREE;
  sc+=gSubCnt(s,'010100')*PAT_SCORE.LIVE_TWO;   // 跳活二
  sc+=gSubCnt(s,'001010')*PAT_SCORE.LIVE_TWO;
  sc+=gSubCnt(s,'010010')*PAT_SCORE.LIVE_TWO;
  gLScCache[s]=sc;
  return sc;
}
function gLineCalc(li,p){
  var cells=gLines[li],s='';
  for(var i=0;i<cells.length;i++){
    var k=cells[i],v=gB[(k/GS)|0][k%GS];
    s+=(v===0?'0':(v===p?'1':'2'));
  }
  return gLineScoreStr(s);
}
function gUpdCell(x,y){
  var lis=gCellLine[y*GS+x];
  for(var i=0;i<lis.length;i++){
    var li=lis[i];
    gTot[0]-=gLSc[li*2];gTot[1]-=gLSc[li*2+1];
    var a=gLineCalc(li,1),b=gLineCalc(li,2);
    gLSc[li*2]=a;gLSc[li*2+1]=b;
    gTot[0]+=a;gTot[1]+=b;
  }
}
function gMake(x,y,p){gB[y][x]=p;gUpdCell(x,y)}
function gUnmake(x,y){gB[y][x]=0;gUpdCell(x,y)}
function gTotSync(){
  gTot[0]=0;gTot[1]=0;
  for(var li=0;li<gLines.length;li++){
    var a=gLineCalc(li,1),b=gLineCalc(li,2);
    gLSc[li*2]=a;gLSc[li*2+1]=b;gTot[0]+=a;gTot[1]+=b;
  }
}

// 候选位置生成 (Uint8Array标记代替Set,快3-5倍)
var _gCandMask=new Uint8Array(GS*GS);
function gCands(b,range){
  range=range||2;
  _gCandMask.fill(0);var cnt=0;
  for(var y=0;y<GS;y++)for(var x=0;x<GS;x++){
    if(b[y][x]===0)continue;
    for(var dy=-range;dy<=range;dy++){
      var ny=y+dy;if(ny<0||ny>=GS)continue;
      for(var dx=-range;dx<=range;dx++){
        var nx=x+dx;if(nx<0||nx>=GS)continue;
        var k=ny*GS+nx;
        if(b[ny][nx]===0&&!_gCandMask[k]){_gCandMask[k]=1;cnt++}
      }
    }
  }
  var arr=[];
  if(cnt===0)arr.push({x:7,y:7});
  else for(var k2=0;k2<GS*GS&&arr.length<cnt;k2++)if(_gCandMask[k2])arr.push({x:k2%GS,y:(k2/GS)|0});
  return arr;
}

// 检查胜利
function gCheckWin(b,x,y,p){
  var D=[[1,0],[0,1],[1,1],[1,-1]];
  for(var d=0;d<4;d++){
    var c=1;
    for(var i=1;i<5;i++){var nx=x+D[d][0]*i,ny=y+D[d][1]*i;if(nx<0||nx>=GS||ny<0||ny>=GS||b[ny][nx]!==p)break;c++}
    for(var i=1;i<5;i++){var nx=x-D[d][0]*i,ny=y-D[d][1]*i;if(nx<0||nx>=GS||ny<0||ny>=GS||b[ny][nx]!==p)break;c++}
    if(c>=5)return true;
  }
  return false;
}

// Zobrist哈希
var gZob=new Array(GS*GS*2);
for(var i=0;i<gZob.length;i++)gZob[i]=Math.random()*0xFFFFFFFF;
var gZobNull=Math.random()*0xFFFFFFFF; // 空着标记位: 防置换表污染(空着翻转行棋方但棋盘不变)
function gHash(b){
  var h=0;
  for(var y=0;y<GS;y++)for(var x=0;x<GS;x++){
    if(b[y][x]===1)h^=gZob[(y*GS+x)*2];
    else if(b[y][x]===2)h^=gZob[(y*GS+x)*2+1];
  }
  return h>>>0;
}

// 找出一方当前所有"落子即成五"的点
function gFivePts(b,p){
  var pts=[],cs=gCands(b,1);
  for(var i=0;i<cs.length;i++){
    var x=cs[i].x,y=cs[i].y;
    b[y][x]=p;
    if(gCheckWin(b,x,y,p))pts.push({x:x,y:y});
    b[y][x]=0;
  }
  return pts;
}
// VCF连续冲四杀 (严格正确版):
// 攻方只走冲四/活四; 守方唯一有效防守=堵成五点(反四无效:攻方下一手直接连五)
// 守方若有立即成五点→攻方冲四作废; 活四(双成五点)不可挡=必胜
// 旧版把"攻方还能再造新四"当作不可防守→大量误报必胜→AI幻觉杀棋走败着,已修复
var gVNodes=0;
function gVCF(b,attacker,depth){
  if(gAbort)return null;
  var opp=3-attacker;
  var cs=gCands(b,1);
  // 1. 立即成五
  for(var i=0;i<cs.length;i++){
    var x=cs[i].x,y=cs[i].y;
    b[y][x]=attacker;
    var w=gCheckWin(b,x,y,attacker);
    b[y][x]=0;
    if(w)return{x:x,y:y};
  }
  if(depth<=0)return null;
  if((++gVNodes&255)===0&&Date.now()-gStart>gTimeLimit){gAbort=true;return null}
  // 2. 所有冲四/活四着法(含跳冲四)
  var fours=[];
  for(i=0;i<cs.length;i++){
    var pc=gPatCount(b,cs[i].x,cs[i].y,attacker);
    if(pc.LIVE_FOUR>0||pc.RUSH_FOUR>0)fours.push(cs[i]);
  }
  if(fours.length===0)return null;
  fours.sort(function(a,c){return gEvalPt(b,c.x,c.y,attacker)-gEvalPt(b,a.x,a.y,attacker)});
  for(i=0;i<fours.length;i++){
    var m=fours[i];
    b[m.y][m.x]=attacker;
    // 守方还能立即成五? → 此冲四作废
    var ofs=gFivePts(b,opp);
    if(ofs.length===0){
      var mf=gFivePts(b,attacker);
      if(mf.length>=2){b[m.y][m.x]=0;return m} // 活四必胜
      if(mf.length===1){
        var d=mf[0]; // 冲四唯一防点
        b[d.y][d.x]=opp;
        var r=gVCF(b,attacker,depth-1);
        b[d.y][d.x]=0;
        b[m.y][m.x]=0;
        if(r)return m;
      }else{
        b[m.y][m.x]=0;
        continue;
      }
    }else{
      b[m.y][m.x]=0;
    }
    if(gAbort)return null;
  }
  return null;
}
// VCT连续威胁杀 (冲四+活三): 攻方取最强若干威胁着法, 守方防点完整枚举
// 守方防点 = 攻方所有成五/成四点(堵) ∪ 守方所有成五/成四点(反四反击)
function gVCT(b,attacker,depth){
  if(gAbort)return null;
  var opp=3-attacker;
  var cs=gCands(b,1);
  // 1. 立即成五
  for(var i=0;i<cs.length;i++){
    var x=cs[i].x,y=cs[i].y;
    b[y][x]=attacker;
    var w=gCheckWin(b,x,y,attacker);
    b[y][x]=0;
    if(w)return{x:x,y:y};
  }
  if(depth<=0)return null;
  if((++gVNodes&255)===0&&Date.now()-gStart>gTimeLimit){gAbort=true;return null}
  // 2. 威胁着法: 冲四/活四/活三
  var tms=[];
  for(i=0;i<cs.length;i++){
    var pc=gPatCount(b,cs[i].x,cs[i].y,attacker);
    if(pc.LIVE_FOUR>0||pc.RUSH_FOUR>0||pc.LIVE_THREE>0)tms.push(cs[i]);
  }
  if(tms.length===0)return null;
  tms.sort(function(a,c){return gEvalPt(b,c.x,c.y,attacker)-gEvalPt(b,a.x,a.y,attacker)});
  var tmN=depth>=8?16:10;
  if(tms.length>tmN)tms.length=tmN;
  for(i=0;i<tms.length;i++){
    var m=tms[i];
    b[m.y][m.x]=attacker;
    var ofs=gFivePts(b,opp);
    if(ofs.length===0){
      var mf=gFivePts(b,attacker);
      if(mf.length>=2){b[m.y][m.x]=0;return m}
      if(mf.length===1){
        var d=mf[0]; // 冲四: 守方唯一防点
        b[d.y][d.x]=opp;
        var r=gVCT(b,attacker,depth-1);
        b[d.y][d.x]=0;b[m.y][m.x]=0;
        if(r)return m;
      }else{
        // 活三等: 守方防点完整枚举, 全部失败才是真必胜
        var defs=gVCTDefs(b,attacker);
        if(defs.length>0){
          var allWin=true;
          for(var j=0;j<defs.length;j++){
            var dd=defs[j];
            b[dd.y][dd.x]=opp;
            if(gCheckWin(b,dd.x,dd.y,opp)){b[dd.y][dd.x]=0;allWin=false;break}
            var r2=gVCT(b,attacker,depth-1);
            b[dd.y][dd.x]=0;
            if(!r2){allWin=false;break}
            if(gAbort)break;
          }
          b[m.y][m.x]=0;
          if(gAbort)return null;
          if(allWin)return m;
        }else{
          b[m.y][m.x]=0;
        }
      }
    }else{
      b[m.y][m.x]=0;
    }
    if(gAbort)return null;
  }
  return null;
}
// VCT防守点集合: 攻方成五/成四点(堵) + 守方成五/成四点(反四)
function gVCTDefs(b,attacker){
  var opp=3-attacker,defs=[],seen=new Uint8Array(GS*GS);
  var cs=gCands(b,1);
  for(var i=0;i<cs.length;i++){
    var x=cs[i].x,y=cs[i].y,k=y*GS+x;
    if(seen[k])continue;
    var pc=gPatCount(b,x,y,attacker);
    if(pc.FIVE>0||pc.LIVE_FOUR>0||pc.RUSH_FOUR>0){seen[k]=1;defs.push({x:x,y:y});continue}
    var dc=gPatCount(b,x,y,opp);
    if(dc.FIVE>0||dc.LIVE_FOUR>0||dc.RUSH_FOUR>0){seen[k]=1;defs.push({x:x,y:y})}
  }
  return defs;
}

// 棋盘全局评估 - O(1)增量版: 直接读行级评分总计(gTot由gMake/gUnmake在搜索中维护)
// 代替旧版全盘逐子重算(O(225)*4方向), 叶子评估提速10-20倍
function gEvalBoard(aiP,huP){
  var hw=curDiff>=4?1.35:curDiff>=3?1.2:1.08;
  return gTot[aiP-1]-gTot[huP-1]*hw;
}

// PVS搜索 (主变例搜索) + 空着剪枝 + 威胁延伸 (增量Zobrist哈希)
function gAlphaBeta(b,depth,alpha,beta,maxP,aiP,huP,ply,hIn){
  gNodes++;
  if(gAbort||(gNodes&1023)===0&&Date.now()-gStart>gTimeLimit){gAbort=true;return 0}
  if(ply>=64)return gEvalBoard(aiP,huP);
  // 置换表查询 (哈希由父节点增量传入,省去每节点O(225)全盘重算)
  var h=(hIn===undefined||hIn===null)?gHash(b):(hIn>>>0);
  var tt=gTT[h%gTTSize];
  if(tt&&tt.h===h&&tt.mp===maxP&&tt.depth>=depth){
    if(tt.flag===0)return tt.score;
    if(tt.flag===1&&tt.score>=beta)return tt.score;
    if(tt.flag===2&&tt.score<=alpha)return tt.score;
  }
  if(depth===0)return gEvalBoard(aiP,huP);
  var cs=gCands(b,1);
  if(cs.length===0)return gEvalBoard(aiP,huP);
  // 威胁延伸已移除: 原实现 threatExt=1 时递归深度传 extDepth-1=depth 深度不减,
  // 中局每层均有威胁→搜索深度永不下降→搜索爆炸(30s无法返回)。强制威胁由VCF/VCT专门处理。
  var extDepth=depth;
  // 空着剪枝 (depth>=3, 大师难度, 有限beta才启用: ±Infinity窗口下-beta+1=非法窗口导致Infinity污染) 
  // 空着节点哈希异或gZobNull: 棋盘相同但轮次翻转,必须区分,否则置换表污染→乱下
  if(curDiff>=4&&depth>=3&&beta<5000000&&beta>-5000000){
    var nullSc=-gAlphaBeta(b,depth-3,-beta,-beta+1,!maxP,aiP,huP,ply+1,(h^gZobNull)>>>0);
    if(gAbort)return 0;
    if(nullSc>=beta)return beta;
  }
  // 着法排序: 置换表最佳着法优先 + 评分排序
  var ttBestMove=tt?tt.bm:null;
  var scored=cs.map(function(c){
    var s=gEvalPt(b,c.x,c.y,maxP?aiP:huP)+gEvalPt(b,c.x,c.y,maxP?huP:aiP)*0.9;
    // 置换表最佳着法最优先
    if(ttBestMove&&ttBestMove.x===c.x&&ttBestMove.y===c.y)s+=100000;
    // 杀手走法加成
    if(gKiller[ply]&&gKiller[ply].x===c.x&&gKiller[ply].y===c.y)s+=5000;
    // 历史启发
    s+=gHistory[c.y*GS+c.x]||0;
    return{x:c.x,y:c.y,s:s};
  });
  scored.sort(function(a,c){return c.s-a.s});
  var topN=curDiff>=4?20:depth>=4?10:14;
  var top=scored.slice(0,topN);
  var bm=null,oa=alpha,first=true;
  for(var i=0;i<top.length;i++){
    var x=top[i].x,y=top[i].y;
    if(b[y][x]!==0)continue;
    var p=maxP?aiP:huP;
    gMake(x,y,p);
    var nh=h^gZob[(y*GS+x)*2+(p-1)];
    if(gCheckWin(b,x,y,p)){
      gUnmake(x,y);
      var ws=maxP?900000+extDepth*100:-900000-extDepth*100;
      if(ws>=beta)return ws;
      if(ws>alpha){alpha=ws;bm={x:x,y:y};first=false}
      continue;
    }
    var sc;
    if(first){
      sc=-gAlphaBeta(b,extDepth-1,-beta,-alpha,!maxP,aiP,huP,ply+1,nh);
    }else{
      // LMR (Late Move Reduction) — 多级削减
      var reduction=0;
      if(curDiff>=4){
        if(i>=12&&extDepth>=6)reduction=3;
        else if(i>=8&&extDepth>=5)reduction=2;
        else if(i>=4&&extDepth>=3)reduction=1;
      }else if(curDiff>=3){
        if(i>=8&&extDepth>=4)reduction=1;
      }
      sc=-gAlphaBeta(b,extDepth-1-reduction,-alpha-1,-alpha,!maxP,aiP,huP,ply+1,nh);
      if(sc>alpha&&reduction>0){
        sc=-gAlphaBeta(b,extDepth-1,-beta,-alpha,!maxP,aiP,huP,ply+1,nh);
      }
    }
    gUnmake(x,y);
    if(gAbort)return 0;
    if(sc>=beta){
      if(!maxP){gKiller[ply]={x:x,y:y}}
      gHistory[y*GS+x]=(gHistory[y*GS+x]||0)+extDepth*extDepth;
      gTT[h%gTTSize]={h:h,mp:maxP,depth:extDepth,score:sc,flag:1,bm:{x:x,y:y}};
      return sc;
    }
    if(sc>alpha){alpha=sc;bm={x:x,y:y};first=false}
  }
  var flag=first?2:0;
  gTT[h%gTTSize]={h:h,mp:maxP,depth:extDepth,score:alpha,flag:flag,bm:bm};
  return alpha;
}

// 26种开局定式 (天元起手)
var GOMOKU_OPENINGS=[
  // 直止开局 D1-D13 (白2在黑1正侧方)
  {name:'寒星',w2:[0,1],b3:[0,-1]},{name:'溪月',w2:[0,1],b3:[1,-1]},
  {name:'疏星',w2:[0,1],b3:[1,0]},{name:'花月',w2:[0,1],b3:[1,1]},

// 五子棋威胁分析: 分析当前局面的威胁等级
function gThreatAnalysis(b,p){
  var opp=3-p;
  var myThreats={five:0,liveFour:0,rushFour:0,liveThree:0,sleepThree:0,liveTwo:0};
  var oppThreats={five:0,liveFour:0,rushFour:0,liveThree:0,sleepThree:0,liveTwo:0};
  var cs=gCands(b,2);
  for(var i=0;i<cs.length;i++){
    var x=cs[i].x,y=cs[i].y;
    // 己方威胁
    var mpc=gPatCount(b,x,y,p);
    if(mpc.FIVE)myThreats.five++;
    if(mpc.LIVE_FOUR)myThreats.liveFour++;
    if(mpc.RUSH_FOUR)myThreats.rushFour++;
    if(mpc.LIVE_THREE)myThreats.liveThree++;
    if(mpc.SLEEP_THREE)myThreats.sleepThree++;
    if(mpc.LIVE_TWO)myThreats.liveTwo++;
    // 对方威胁
    var opc=gPatCount(b,x,y,opp);
    if(opc.FIVE)oppThreats.five++;
    if(opc.LIVE_FOUR)oppThreats.liveFour++;
    if(opc.RUSH_FOUR)oppThreats.rushFour++;
    if(opc.LIVE_THREE)oppThreats.liveThree++;
    if(opc.SLEEP_THREE)oppThreats.sleepThree++;
    if(opc.LIVE_TWO)oppThreats.liveTwo++;
  }
  return{my:myThreats,opp:oppThreats};
}
// 根据威胁分析决定策略: 进攻/防守/均衡
function gStrategy(b,p){
  var ta=gThreatAnalysis(b,p);
  // 对方有连五威胁 -> 必须防守
  if(ta.opp.five>0)return'must_defend';
  // 己方有连五机会 -> 进攻
  if(ta.my.five>0)return'must_attack';
  // 对方有活四 -> 必须防守
  if(ta.opp.liveFour>0)return'must_defend';
  // 己方有活四 -> 进攻
  if(ta.my.liveFour>0)return'must_attack';
  // 己方有双活三或活三+冲四 -> 进攻
  if(ta.my.liveThree>=2||(ta.my.liveThree>=1&&ta.my.rushFour>=1))return'attack';
  // 对方有双活三或活三+冲四 -> 防守
  if(ta.opp.liveThree>=2||(ta.opp.liveThree>=1&&ta.opp.rushFour>=1))return'defend';
  // 己方有活三 -> 进攻
  if(ta.my.liveThree>=1)return'attack';
  // 对方有活三 -> 防守
  if(ta.opp.liveThree>=1)return'defend';
  // 默认: 均衡
  return'balance';
}

// UI让行(MessageChannel零延迟宏任务,避开setTimeout嵌套4ms钳制): 深层搜索分块执行不冻结界面

    gYieldChan=new MessageChannel();
    gYieldChan.port1.onmessage=function(){var f=gYieldQ.shift();if(f)f()};

}

function gAIMove(cb){
  var aiP=playerFirst?2:1,huP=playerFirst?1:2;
  gNodes=0;gVNodes=0;gStart=Date.now();gAbort=false;
  var budget=curDiff>=4?8000:curDiff>=3?4500:curDiff>=2?2500:1500;
  gTimeLimit=Math.min(1500,budget*0.4); // VCF/VCT阶段预算
  gTTSize=curDiff>=4?400003:150003;
  gTT=new Array(gTTSize);
  gKiller=new Array(24);
  gHistory=new Array(GS*GS).fill(0);
  gTotSync(); // 行级增量评估初始化(搜索全程由gMake/gUnmake维护gTot)
  var gen=++gGen; // 搜索代数: 重开/换局后旧异步链自动失效
  
  var cs=gCands(gB,2);
  
  // 开局阶段: 使用定式
  var stoneCount=0;
  for(var y=0;y<GS;y++)for(var x=0;x<GS;x++)if(gB[y][x]!==0)stoneCount++;
  
  if(stoneCount===0){
    // AI先手, 下天元
    showAIInfo('<span class="tag">开局</span> 天元');
    cb({x:7,y:7});return;
  }
  if(stoneCount===1){
    // 对方已下天元, AI应手用定式
    var op=GOMOKU_OPENINGS[Math.floor(Math.random()*GOMOKU_OPENINGS.length)];
    // 找到对方的位置
    var ox=7,oy=7;
    for(var yy=0;yy<GS;yy++)for(var xx=0;xx<GS;xx++)if(gB[yy][xx]===1){ox=xx;oy=yy}
    var wx=ox+op.w2[0],wy=oy+op.w2[1];
    if(wx>=0&&wx<GS&&wy>=0&&wy<GS&&gB[wy][wx]===0){
      showAIInfo('<span class="tag">开局定式</span> '+op.name);
      cb({x:wx,y:wy});return;
    }
  }
  
  // 1. 必胜: 连五
  for(var i=0;i<cs.length;i++){
    gB[cs[i].y][cs[i].x]=aiP;
    if(gCheckWin(gB,cs[i].x,cs[i].y,aiP)){gB[cs[i].y][cs[i].x]=0;showAIInfo('<span class="tag">连五</span> 致胜一手');cb(cs[i]);return}
    gB[cs[i].y][cs[i].x]=0;
  }
  // 2. 必防: 阻止对方连五
  for(var i=0;i<cs.length;i++){
    gB[cs[i].y][cs[i].x]=huP;
    if(gCheckWin(gB,cs[i].x,cs[i].y,huP)){gB[cs[i].y][cs[i].x]=0;showAIInfo('<span class="tag">防守</span> 阻止连五');cb(cs[i]);return}
    gB[cs[i].y][cs[i].x]=0;
  }
  // 3. 活四进攻
  for(var i=0;i<cs.length;i++){
    var pc=gPatCount(gB,cs[i].x,cs[i].y,aiP);
    if(pc.LIVE_FOUR>0){showAIInfo('<span class="tag">进攻</span> 活四');cb(cs[i]);return}
  }
  // 4. 防守对方活四
  for(var i=0;i<cs.length;i++){
    var pc=gPatCount(gB,cs[i].x,cs[i].y,huP);
    if(pc.LIVE_FOUR>0){showAIInfo('<span class="tag">防守</span> 阻活四');cb(cs[i]);return}
  }
  // 5. VCF搜索 (难度2+)
  if(curDiff>=2){
    var vcfDepth=curDiff>=4?40:curDiff===3?22:12;
    var vcf=gVCF(gB,aiP,vcfDepth);
    if(vcf){showAIInfo('<span class="tag">VCF</span> 连续冲四杀 (深度'+vcfDepth+')');cb(vcf);return}
    // 防守对方VCF
    var dvcf=gVCF(gB,huP,vcfDepth-4);
    if(dvcf){
      // 检查自己是否有活四反击
      var hasOff=false;
      for(var i=0;i<cs.length;i++){
        var apc=gPatCount(gB,cs[i].x,cs[i].y,aiP);
        if(apc.LIVE_FOUR>0){hasOff=true;showAIInfo('<span class="tag">反击</span> 活四反击');cb(cs[i]);return}
      }
      if(!hasOff){showAIInfo('<span class="tag">防守</span> 阻VCF');cb(dvcf);return}
    }
  }
  // 6. VCT搜索 (难度3+)
  if(curDiff>=3){
    var vctDepth=curDiff>=4?28:10;
    var vct=gVCT(gB,aiP,vctDepth);
    if(vct){showAIInfo('<span class="tag">VCT</span> 连续威胁杀');cb(vct);return}
    var dvct=gVCT(gB,huP,curDiff>=4?16:10);
    if(dvct){showAIInfo('<span class="tag">防守</span> 阻VCT');cb(dvct);return}
  }
  // 7/8. 双活三捷径 (仅低难度; 高难度交给全搜索判断更精准)
  if(curDiff<=2){
    for(var i=0;i<cs.length;i++){
      var pc=gPatCount(gB,cs[i].x,cs[i].y,aiP);
      if(pc.LIVE_THREE>=2){showAIInfo('<span class="tag">进攻</span> 双活三');cb(cs[i]);return}
    }
    for(var i=0;i<cs.length;i++){
      var pc=gPatCount(gB,cs[i].x,cs[i].y,huP);
      if(pc.LIVE_THREE>=2){showAIInfo('<span class="tag">防守</span> 阻双活三');cb(cs[i]);return}
    }
  }
  // 9. 迭代加深PVS搜索 — 异步分块执行(每个根着法搜索后按需让行UI, 界面零冻结)
  var maxDepth=curDiff===1?6:curDiff===2?8:curDiff===3?12:22;
  var scored=cs.map(function(c){
    return{x:c.x,y:c.y,s:gEvalPt(gB,c.x,c.y,aiP)*1.5+gEvalPt(gB,c.x,c.y,huP)*1.2}
  });
  scored.sort(function(a,c){return c.s-a.s});
  var topN=curDiff>=4?32:curDiff>=3?20:12;
  var top=scored.slice(0,Math.min(topN,scored.length));
  var best=top[0],bs=-Infinity;
  // 走法多样化: 近似等价着法随机选择(幅度小于最小棋型分差,不损棋力,避免每局走法完全固化)
  var jitter=curDiff>=4?150:curDiff>=3?500:curDiff>=2?1200:2500;
  var rh=gHash(gB);
  var id=2,doneDepth=0,lastYield=Date.now();
  gTimeLimit=budget; // 主搜索阶段使用全额预算
  gAbort=false;
  function finish(){
    if(gen!==gGen||!gAiThink||curGame!=='gomoku')return;
    var info='<span class="tag">搜索</span> 深度'+doneDepth+' 节点'+gNodes+' 耗时'+((Date.now()-gStart)/1000).toFixed(1)+'s';
    if(bs>800000)info+=' [优势]';
    else if(bs<-800000)info+=' [劣势]';
    showAIInfo(info);
    cb(best);
  }
  function runIter(){
    if(gen!==gGen||!gAiThink||curGame!=='gomoku')return;
    if(id>maxDepth||gAbort){finish();return}
    var rootBest=null,rootScore=-Infinity,rootJit=-Infinity,rootAlpha=-5000000; // rootAlpha有限: ±Infinity经零窗口运算产生NaN/Infinity污染
    var i=0;
    function step(){
      if(gen!==gGen||!gAiThink||curGame!=='gomoku')return;
      if(gAbort||i>=top.length){endIter();return}
      var mx=top[i].x,my=top[i].y;
      gMake(mx,my,aiP);
      var mh=rh^gZob[(my*GS+mx)*2+(aiP-1)];
      var sc;
      if(i===0){
        sc=-gAlphaBeta(gB,id-1,-5000000,5000000,false,aiP,huP,0,mh);
      }else{
        sc=-gAlphaBeta(gB,id-1,-rootAlpha-1,-rootAlpha,false,aiP,huP,0,mh); // PVS零窗口
        if(!gAbort&&sc>rootAlpha)sc=-gAlphaBeta(gB,id-1,-5000000,-rootAlpha,false,aiP,huP,0,mh);
      }
      gUnmake(mx,my);
      if(!gAbort){
        top[i].ls=sc;
        var js=sc+(Math.random()*2-1)*jitter;
        if(js>rootJit){rootJit=js;rootScore=sc;rootBest=top[i]}
        if(sc>rootAlpha)rootAlpha=sc;
      }
      i++;
      if(!gAbort&&Date.now()-gStart>gTimeLimit)gAbort=true;
      if(Date.now()-lastYield>12){lastYield=Date.now();gYield(step)}
      else step();
    }
    function endIter(){
      if(rootBest){best=rootBest;bs=rootScore;doneDepth=id}
      if(gAbort||gen!==gGen||!gAiThink||curGame!=='gomoku'){finish();return}
      top.sort(function(a,c){return(c.ls||-Infinity)-(a.ls||-Infinity)}); // 上层得分重排根着法,下一迭代更快命中最佳
      if(Date.now()-gStart>gTimeLimit*0.5){gAbort=true;finish();return} // 剩余预算不足以完成更深一层
      id+=2;
      runIter();
    }
    step();
  }
  runIter();
}

function goNb(x,y){
  var key=x*GSZ+y;
  if(goNbCache[key])return goNbCache[key];
  var r=[];
  if(x>0)r.push([x-1,y]);if(x<GSZ-1)r.push([x+1,y]);
  if(y>0)r.push([x,y-1]);if(y<GSZ-1)r.push([x,y+1]);
  goNbCache[key]=r;return r;
}
// 计算棋链和气
function goGrp(b,x,y){
  var c=b[x][y];if(c===0)return{stones:[],liberties:[]};
  var vis=new Uint8Array(GSZ*GSZ),st=[],lb=new Uint8Array(GSZ*GSZ);
  var q=new Int32Array(GSZ*GSZ),qh=0,qt=0;
  q[qt++]=x*GSZ+y;vis[x*GSZ+y]=1;
  while(qh<qt){
    var p=q[qh++],cx2=(p/GSZ)|0,cy2=p%GSZ;st.push([cx2,cy2]);
    var ns=goNb(cx2,cy2);
    for(var i=0;i<ns.length;i++){
      var nx=ns[i][0],ny=ns[i][1],k=nx*GSZ+ny;
      if(b[nx][ny]===0)lb[k]=1;
      else if(b[nx][ny]===c&&!vis[k]){vis[k]=1;q[qt++]=k}
    }
  }
  var libs=[];for(var k2=0;k2<GSZ*GSZ;k2++)if(lb[k2])libs.push(k2);
  return{stones:st,liberties:libs};
}
// 尝试落子
function goTry(b,x,y,c,ko){
  if(x<0||x>=GSZ||y<0||y>=GSZ||b[x][y]!==0)return{valid:false};
  if(ko&&ko.x===x&&ko.y===y)return{valid:false};
  var nb=b.map(function(r){return r.slice()});nb[x][y]=c;
  var opp=c===1?2:1,cap=[];
  var ns=goNb(x,y);
  for(var i=0;i<ns.length;i++){
    var nx=ns[i][0],ny=ns[i][1];
    if(nb[nx][ny]===opp){
      var g=goGrp(nb,nx,ny);
      if(g.liberties.length===0){
        for(var j=0;j<g.stones.length;j++){
          nb[g.stones[j][0]][g.stones[j][1]]=0;cap.push([g.stones[j][0],g.stones[j][1]]);
        }
      }
    }
  }
  var og=goGrp(nb,x,y);
  if(og.liberties.length===0)return{valid:false};
  var nk=null;
  if(cap.length===1&&og.stones.length===1)nk={x:cap[0][0],y:cap[0][1]};
  return{valid:true,captured:cap,newBoard:nb,newKo:nk};
}
// 领地估算 (Bouzy膨胀腐蚀法)
function goTerr(b){
  var t=[];
  for(var i=0;i<GSZ;i++)t.push(new Array(GSZ).fill(0));
  var vis=new Uint8Array(GSZ*GSZ);
  var q=new Int32Array(GSZ*GSZ);
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    if(b[x][y]!==0||vis[x*GSZ+y])continue;
    var bd0=0,bd1=0;q[0]=x*GSZ+y;vis[x*GSZ+y]=1;
    var qh=0,qt=1;
    while(qh<qt){
      var p=q[qh++],cx2=(p/GSZ)|0,cy2=p%GSZ;
      var ns=goNb(cx2,cy2);
      for(var i=0;i<ns.length;i++){
        var nx=ns[i][0],ny=ns[i][1],k=nx*GSZ+ny;
        if(b[nx][ny]===0&&!vis[k]){vis[k]=1;q[qt++]=k}
        else if(b[nx][ny]===1)bd0=1;
        else if(b[nx][ny]===2)bd1=1;
      }
    }
    if(bd0+bd1===1){
      var o=bd0?1:2;
      for(var i=0;i<qt;i++){var p2=q[i];t[(p2/GSZ)|0][p2%GSZ]=o}
    }
  }
  return t;
}
// Benson算法: 无条件活棋静态判定
// 拥有两个不重叠关键围区(真眼)的棋链是无条件活的
function goBenson(b){
  var alive={1:[],2:[]}; // 各方无条件活棋链
  // 1. 找出所有棋链
  var chains={1:[],2:[]};
  var visited=new Uint8Array(GSZ*GSZ);
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    if(b[x][y]===0||visited[x*GSZ+y])continue;
    var c=b[x][y];
    var g=goGrp(b,x,y);
    var chain={color:c,stones:g.stones,liberties:g.liberties.map(function(l){return[parseInt(l/GSZ),parseInt(l%GSZ)]})};
    chains[c].push(chain);
    for(var i2=0;i2<g.stones.length;i2++)visited[g.stones[i2][0]*GSZ+g.stones[i2][1]]=1;
  }
  // 2. 找出所有围区(空点连通区域, 边界全为同色)
  var regions=[];
  var rvis=new Uint8Array(GSZ*GSZ);
  var bq=new Int32Array(GSZ*GSZ);
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    if(b[x][y]!==0||rvis[x*GSZ+y])continue;
    var regN=0,bd0=0,bd1=0;bq[0]=x*GSZ+y;rvis[x*GSZ+y]=1;
    var qh=0,qt=1,regArr=new Int32Array(GSZ*GSZ);
    while(qh<qt){
      var p=bq[qh++],cx2=(p/GSZ)|0,cy2=p%GSZ;regArr[regN++]=p;
      var ns=goNb(cx2,cy2);
      for(var i2=0;i2<ns.length;i2++){
        var nx=ns[i2][0],ny=ns[i2][1],k=nx*GSZ+ny;
        if(b[nx][ny]===0&&!rvis[k]){rvis[k]=1;bq[qt++]=k}
        else if(b[nx][ny]===1)bd0=1;
        else if(b[nx][ny]===2)bd1=1;
      }
    }
    if(bd0+bd1===1){
      var pts=[];for(var pi=0;pi<regN;pi++){var rp=regArr[pi];pts.push([(rp/GSZ)|0,rp%GSZ])}
      regions.push({color:bd0?1:2,points:pts});
    }
  }
  // 3. 迭代判定: 检查每条链是否有>=2个关键围区
  var changed=true;
  var aliveChains1=new Uint8Array(256),aliveChains2=new Uint8Array(256);
  while(changed){
    changed=false;
    for(var ci=0;ci<2;ci++){
      var c=ci+1;
      for(var i=0;i<chains[c].length;i++){
        var chain=chains[c][i];
        if((c===1?aliveChains1[i]:aliveChains2[i]))continue;
        var vitalCount=0;
        var libSet=new Uint8Array(GSZ*GSZ);
        for(var li=0;li<chain.liberties.length;li++)libSet[chain.liberties[li][0]*GSZ+chain.liberties[li][1]]=1;
        for(var j=0;j<regions.length;j++){
          if(regions[j].color!==c)continue;
          var isVital=true;
          for(var pi=0;pi<regions[j].points.length;pi++){
            var pt=regions[j].points[pi];
            if(!libSet[pt[0]*GSZ+pt[1]]){isVital=false;break}
          }
          if(isVital)vitalCount++;
        }
        if(vitalCount>=2){
          if(c===1)aliveChains1[i]=1;else aliveChains2[i]=1;
          changed=true;
        }
      }
    }
  }
  // 4. 收集活棋
  for(var ci=0;ci<2;ci++){
    var c=ci+1,ac=c===1?aliveChains1:aliveChains2;
    for(var idx=0;idx<chains[c].length;idx++){
      if(!ac[idx])continue;
      var chain=chains[c][idx];
      for(var i=0;i<chain.stones.length;i++)alive[c].push(chain.stones[i]);
    }
  }
  return alive;
}
