// 检查是否匹配定式
function goMatchJoseki(b){
  var stones=[];
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++)if(b[x][y]!==0)stones.push([x,y,b[x][y]]);
  if(stones.length>12)return null;
  for(var i=0;i<GO_JOSEKI.length;i++){
    var j=GO_JOSEKI[i];
    if(stones.length>=j.moves.length)continue;
    var match=true;
    for(var k=0;k<stones.length;k++){
      if(stones[k][0]!==j.moves[k][0]||stones[k][1]!==j.moves[k][1]||stones[k][2]!==j.moves[k][2]){match=false;break}
    }
    if(match){
      var next=j.moves[stones.length];
      // 对称变换匹配
      var r=goTry(b,next[0],next[1],next[2],null);
      if(r.valid)return{x:next[0],y:next[1]};
      // 尝试旋转对称
      var sx1=GSZ-1-next[0],sy1=next[1];
      r=goTry(b,sx1,sy1,next[2],null);
      if(r.valid)return{x:sx1,y:sy1};
      // 尝试镜像对称
      var sx2=next[0],sy2=GSZ-1-next[1];
      r=goTry(b,sx2,sy2,next[2],null);
      if(r.valid)return{x:sx2,y:sy2};
      // 尝试中心对称
      var sx3=GSZ-1-next[0],sy3=GSZ-1-next[1];
      r=goTry(b,sx3,sy3,next[2],null);
      if(r.valid)return{x:sx3,y:sy3};
    }
  }
  return null;
}
// ============================================================
//  围棋快速引擎 v2 (扁平棋盘 + 增量组ID/气表 + 气溢出重建)
//  落子O(邻域)维护组与气, 邻组气查询O(1), rollout单次模拟<0.2ms
// ============================================================
var GO_MAXG=1400,GO_MAXL=64;
var goRNbF=new Int32Array(GSZ*GSZ*4),goRNbN=new Uint8Array(GSZ*GSZ);
(function(){
  for(var x0=0;x0<GSZ;x0++)for(var y0=0;y0<GSZ;y0++){
    var p0=x0*GSZ+y0,k=0;
    if(x0>0)goRNbF[p0*4+k++]=p0-GSZ;
    if(x0<GSZ-1)goRNbF[p0*4+k++]=p0+GSZ;
    if(y0>0)goRNbF[p0*4+k++]=p0-1;
    if(y0<GSZ-1)goRNbF[p0*4+k++]=p0+1;
    goRNbN[p0]=k;
  }
})();
var goRB=new Int8Array(GSZ*GSZ);       // 棋盘 0空 1黑 2白
var goRId=new Int32Array(GSZ*GSZ);     // 点→组ID (-1空)
var goRNext=new Int32Array(GSZ*GSZ);   // 组成员链表
var goRHead=new Int32Array(GO_MAXG);   // 组链头
var goRLibs=new Int16Array(GO_MAXG*GO_MAXL); // 组气表(记录前GO_MAXL口气)
var goRLibC=new Int16Array(GO_MAXG);   // 组已记录气数
var goRGCol=new Int8Array(GO_MAXG);    // 组颜色
var goROvf=new Uint8Array(GO_MAXG);    // 气表溢出标记(实际气>GO_MAXL, 清零时需重建)
var goRMark=new Int32Array(GO_MAXG);   // 组访问stamp(邻去重)
var goRCapM=new Int32Array(GSZ*GSZ);   // 提子点/区域访问标记
var goRScr=new Int32Array(GSZ*GSZ);    // BFS点访问标记
var goRLibM=new Int32Array(GSZ*GSZ);   // 气去重标记(重建用)
var goRScrQ=new Int32Array(GSZ*GSZ);   // BFS复用队列
var goRFreeG=new Int32Array(GO_MAXG);  // 空闲组ID栈
var goRFreeGN=0,goRNextG=1;
var goRStamp=0,goRCapSt=0;
var goRNear=new Uint8Array(GSZ*GSZ),goRNearList=[];
// goRPlay就地scratch(免分配)
var goRPSg=new Int32Array(4),goRPEg=new Int32Array(4),goRPDead=new Int32Array(4),goRPCaps=new Int32Array(GSZ*GSZ);
function goRAlloc(c){
  var g;
  if(goRFreeGN>0)g=goRFreeG[--goRFreeGN];
  else{g=goRNextG++;goRHead[g]=-1}
  goRGCol[g]=c;goRLibC[g]=0;goROvf[g]=0;goRAtariV[g]=0;
  return g;
}
function goRFree(g){goRFreeG[goRFreeGN++]=g;goRHead[g]=-1;goROvf[g]=0;goRAtariV[g]=0}
// 叫吃(atari)组全局列表: rollout每步感知所有1气组(提敌/逃己)
var goRAtariV=new Uint8Array(GO_MAXG);
var goRAtariL=new Int32Array(1024);
var goRAtariN=0;
function goRUpdAtari(g){
  if(goRHead[g]<0)return;
  if(goRLibC[g]===1&&!goROvf[g]){
    if(!goRAtariV[g]){
      goRAtariV[g]=1;
      if(goRAtariN>=1024)goRCompact();
      goRAtariL[goRAtariN++]=g;
    }
  }else goRAtariV[g]=0;
}
function goRCompact(){
  var w=0;
  for(var i=0;i<goRAtariN;i++){
    var g=goRAtariL[i];
    if(goRAtariV[g]&&goRHead[g]>=0&&goRLibC[g]===1&&!goROvf[g])goRAtariL[w++]=g;
    else goRAtariV[g]=0;
  }
  goRAtariN=w;
}
function goRLibAdd(g,q){
  var base=g*GO_MAXL,c=goRLibC[g],L=goRLibs;
  for(var i=0;i<c;i++)if(L[base+i]===q)return;
  if(c<GO_MAXL){L[base+c]=q;goRLibC[g]=c+1}
  else goROvf[g]=1;
}
function goRLibDel(g,q){
  var base=g*GO_MAXL,c=goRLibC[g],L=goRLibs;
  for(var i=0;i<c;i++){
    if(L[base+i]===q){L[base+i]=L[base+c-1];goRLibC[g]=c-1;return}
  }
}
// 组气重建(溢出清零路径): 从链头BFS收集全部气(排除ex点), ex=正在落的子
function goRRebuildG(g,ex){
  goRLibC[g]=0;goROvf[g]=0;
  var st=++goRStamp,ls=++goRStamp,base=g*GO_MAXL,c=goRGCol[g];
  var qh=0,qt=0,m=goRHead[g];
  goRScrQ[qt++]=m;goRScr[m]=st;
  while(qh<qt){
    var cur=goRScrQ[qh++];
    var nn=goRNbN[cur],cb=cur*4;
    for(var i=0;i<nn;i++){
      var n=goRNbF[cb+i],v=goRB[n];
      if(v===0){
        if(n===ex)continue;
        if(goRLibM[n]!==ls){
          goRLibM[n]=ls;
          if(goRLibC[g]<GO_MAXL)goRLibs[base+goRLibC[g]++]=n;
          else goROvf[g]=1;
        }
      }else if(v===c&&goRScr[n]!==st){goRScr[n]=st;goRScrQ[qt++]=n}
    }
  }
}
// 落子: 返回 -2=非法(占用/劫/自杀) / -1=成功无劫 / >=0=成功且劫点
function goRPlay(p,c,koPos){
  if(goRB[p]!==0||p===koPos)return -2;
  var opp=3-c;
  var st=++goRStamp;
  var Sg=goRPSg,Eg=goRPEg,sN=0,eN=0;
  var nb=goRNbF,nn=goRNbN[p],pb=p*4;
  for(var i=0;i<nn;i++){
    var n=nb[pb+i],v=goRB[n];
    if(v===c){
      var g=goRId[n];
      if(goRMark[g]!==st){goRMark[g]=st;Sg[sN++]=g}
    }else if(v===opp){
      var g2=goRId[n];
      if(goRMark[g2]!==st){goRMark[g2]=st;Eg[eN++]=g2}
    }
  }
  // 敌组减p气, 收集死组(气清零且无溢出时才确认死)
  var Dead=goRPDead,dN=0;
  for(var i2=0;i2<eN;i2++){
    var eg=Eg[i2];
    goRLibDel(eg,p);goRUpdAtari(eg);
    if(goRLibC[eg]===0&&goROvf[eg]){
      goRRebuildG(eg,p);goRUpdAtari(eg);
      if(goRLibC[eg]===0)Dead[dN++]=eg;
    }else if(goRLibC[eg]===0)Dead[dN++]=eg;
  }
  // 标记提子点(暂不执行)
  var capSt=++goRCapSt,caps=goRPCaps,capN=0;
  for(var i3=0;i3<dN;i3++){
    var m=goRHead[Dead[i3]];
    while(m>=0){goRCapM[m]=capSt;caps[capN++]=m;m=goRNext[m]}
  }
  // 自杀判定(提交前): 新气 = ∪Sg气-{p} ∪ p邻(空或提子点)
  var sSt=++goRStamp,cnt=0,ovf=false;
  for(var i4=0;i4<sN;i4++){
    var gb=Sg[i4]*GO_MAXL,gc=goRLibC[Sg[i4]];
    for(var k=0;k<gc;k++){
      var q=goRLibs[gb+k];
      if(q!==p&&goRScr[q]!==sSt){goRScr[q]=sSt;cnt++}
    }
    if(goROvf[Sg[i4]])ovf=true;
  }
  for(var i5=0;i5<nn;i5++){
    var n2=nb[pb+i5],v2=goRB[n2];
    if((v2===0||goRCapM[n2]===capSt)&&goRScr[n2]!==sSt){goRScr[n2]=sSt;cnt++}
  }
  if(cnt===0){
    if(ovf){ // 溢出导致低估: 重建Sg组气重算
      cnt=0;
      for(var i6=0;i6<sN;i6++)goRRebuildG(Sg[i6],p);
      var sSt2=++goRStamp;
      for(var i7=0;i7<sN;i7++){
        var gb2=Sg[i7]*GO_MAXL,gc2=goRLibC[Sg[i7]];
        for(var k2=0;k2<gc2;k2++){
          var q2=goRLibs[gb2+k2];
          if(q2!==p&&goRScr[q2]!==sSt2){goRScr[q2]=sSt2;cnt++}
        }
      }
      for(var i8=0;i8<nn;i8++){
        var n3=nb[pb+i8],v3=goRB[n3];
        if((v3===0||goRCapM[n3]===capSt)&&goRScr[n3]!==sSt2){goRScr[n3]=sSt2;cnt++}
      }
    }
    if(cnt===0){
      for(var i9=0;i9<eN;i9++){goRLibAdd(Eg[i9],p);goRUpdAtari(Eg[i9])} // 回滚敌组减气
      return -2;
    }
  }
  // 执行提子(清邻近标记: 被提点重回候选集)
  for(var i10=0;i10<capN;i10++){var q3=caps[i10];goRB[q3]=0;goRId[q3]=-1;goRNear[q3]=0}
  for(var i11=0;i11<dN;i11++)goRFree(Dead[i11]);
  // 提子点成为邻组的新气
  for(var i12=0;i12<capN;i12++){
    var q4=caps[i12],qb=q4*4,qn=goRNbN[q4];
    for(var j=0;j<qn;j++){
      var n4=nb[qb+j];
      if(goRB[n4]!==0){var ng=goRId[n4];goRLibAdd(ng,q4);goRUpdAtari(ng)}
    }
  }
  // 被提点邻近的存活棋子: 2格邻域空点(含被提点)补回候选集
  if(capN>0){
    for(var i12b=0;i12b<capN;i12b++){
      var q5=caps[i12b],qb5=q5*4,qn5=goRNbN[q5];
      for(var j5=0;j5<qn5;j5++){var n5b=nb[qb5+j5];if(goRB[n5b]!==0)goRAddNear(n5b)}
    }
  }
  // 合并/新建组
  var mg;
  if(sN>0){
    mg=Sg[0];
    for(var i13=1;i13<sN;i13++){
      var sg=Sg[i13],m2=goRHead[sg];
      while(m2>=0){
        var nx=goRNext[m2];
        goRId[m2]=mg;goRNext[m2]=goRHead[mg];goRHead[mg]=m2;
        m2=nx;
      }
      var sgb=sg*GO_MAXL,sgc=goRLibC[sg];
      for(var k3=0;k3<sgc;k3++)goRLibAdd(mg,goRLibs[sgb+k3]);
      if(goROvf[sg])goROvf[mg]=1;
      goRFree(sg);
    }
    goRId[p]=mg;goRNext[p]=goRHead[mg];goRHead[mg]=p;
    for(var i14=0;i14<nn;i14++){var n5=nb[pb+i14];if(goRB[n5]===0)goRLibAdd(mg,n5)}
    goRLibDel(mg,p);
  }else{
    mg=goRAlloc(c);
    goRId[p]=mg;goRNext[p]=-1;goRHead[mg]=p;
    for(var i15=0;i15<nn;i15++){var n6=nb[pb+i15];if(goRB[n6]===0)goRLibAdd(mg,n6)}
  }
  goRB[p]=c;
  goRAddNear(p);
  goRUpdAtari(mg);
  if(capN===1&&sN===0)return caps[0];
  return -1;
}
// 邻近标记: p周围2格空点加入候选集
function goRAddNear(p){
  var x=(p/GSZ)|0,y=p%GSZ;
  for(var dx=-2;dx<=2;dx++){
    var nx=x+dx;if(nx<0||nx>=GSZ)continue;
    for(var dy=-2;dy<=2;dy++){
      var ny=y+dy;if(ny<0||ny>=GSZ)continue;
      var np=nx*GSZ+ny;
      if(goRB[np]===0&&!goRNear[np]){goRNear[np]=1;goRNearList.push(np)}
    }
  }
}
// 候选集重建(压缩累积的死点)
function goRNearRebuild(){
  goRNear.fill(0);goRNearList.length=0;
  for(var p=0;p<GSZ*GSZ;p++){
    if(goRB[p]!==0)goRAddNear(p);
  }
}
// 真眼判断
function goRIsEye(p,c){
  var nb=goRNbF,nn=goRNbN[p],pb=p*4;
  for(var i=0;i<nn;i++)if(goRB[nb[pb+i]]!==c)return false;
  var x=(p/GSZ)|0,y=p%GSZ,sc=0,wl=0;
  for(var dx=-1;dx<=1;dx+=2)for(var dy=-1;dy<=1;dy+=2){
    var nx=x+dx,ny=y+dy;
    if(nx<0||nx>=GSZ||ny<0||ny>=GSZ)wl++;
    else if(goRB[nx*GSZ+ny]===c)sc++;
    else wl++;
  }
  if(wl>0)return sc+wl>=4;
  return sc>=3;
}
// c方可落候选(邻近空点, 排真眼)
function goRCands(c){
  var out=[];
  for(var i=0;i<goRNearList.length;i++){
    var p=goRNearList[i];
    if(goRB[p]!==0)continue;
    if(goRIsEye(p,c))continue;
    out.push(p);
  }
  return out;
}
// 载入局面: 重建棋盘+分组结构(免分配, stamp归零+标记清空防串扰)
function goRLoad(b){
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++)goRB[x*GSZ+y]=b[x][y];
  goRNextG=1;goRFreeGN=0;goRStamp=0;goRCapSt=0;
  goRId.fill(-1);goRScr.fill(0);goRLibM.fill(0);goRMark.fill(0);goRCapM.fill(0);
  goROvf.fill(0);goRLibC.fill(0);goRHead.fill(-1);
  for(var p=0;p<GSZ*GSZ;p++){
    if(goRB[p]===0||goRId[p]>=0)continue;
    var g=goRAlloc(goRB[p]);
    var qh=0,qt=0;
    goRScrQ[qt++]=p;goRId[p]=g;
    var seen=++goRStamp;
    goRScr[p]=seen;
    while(qh<qt){
      var cur=goRScrQ[qh++];
      goRNext[cur]=goRHead[g];goRHead[g]=cur;
      var nn=goRNbN[cur],cb=cur*4;
      for(var i=0;i<nn;i++){
        var n=goRNbF[cb+i],v=goRB[n];
        if(v===0)goRLibAdd(g,n);
        else if(v===goRB[p]&&goRScr[n]!==seen){goRScr[n]=seen;goRId[n]=g;goRScrQ[qt++]=n}
      }
    }
  }
  goRNear.fill(0);goRNearList.length=0;
  for(var p2=0;p2<GSZ*GSZ;p2++){
    if(goRB[p2]!==0)goRAddNear(p2);
  }
  goRAtariV.fill(0);goRAtariN=0;
  for(var g2=1;g2<goRNextG;g2++){
    if(goRHead[g2]>=0&&goRLibC[g2]===1&&!goROvf[g2]){goRAtariV[g2]=1;goRAtariL[goRAtariN++]=g2}
  }
}
// 轻量模式权重(rollout着法选择)
function goRPatternW(p,c){
  var w=1;
  var nb=goRNbF,nn=goRNbN[p],pb=p*4,own=0,opn=0;
  for(var i=0;i<nn;i++){
    var v=goRB[nb[pb+i]];
    if(v===c)own++;else if(v!==0)opn++;
  }
  if(own>=1)w+=0.5;
  if(own>=2)w+=0.3;
  if(opn>=1)w+=0.4;
  var x=(p/GSZ)|0,y=p%GSZ;
  if(x>0&&y>0&&goRB[p-GSZ-1]===c)w+=0.2;
  if(x>0&&y<GSZ-1&&goRB[p-GSZ+1]===c)w+=0.2;
  if(x<GSZ-1&&y>0&&goRB[p+GSZ-1]===c)w+=0.2;
  if(x<GSZ-1&&y<GSZ-1&&goRB[p+GSZ+1]===c)w+=0.2;
  var edge=Math.min(x,y,GSZ-1-x,GSZ-1-y);
  if(edge===2)w+=0.15;
  if(edge===3)w+=0.25;
  if(edge===0)w*=0.3;
  if(edge===1)w*=0.6;
  return w;
}
// 死子迭代清理: 眼位不足(<2)的链判死移除, 侵入对方实空的死子不再计分
// 修正"围空送分"bug: 中国规则死子点归围住的一方
var goRDG=new Int32Array(GSZ*GSZ);   // 点→本轮链ID
var goRDCol=new Int8Array(GSZ*GSZ);  // 链颜色
var goRDEye=new Int16Array(GSZ*GSZ); // 链眼位
var goRGEye=new Int16Array(GO_MAXG); // 组ID→眼位(增量模式首轮用)
var goRDNbC=new Int32Array(64);      // 区域邻接链ID缓存
function goRCleanDead(){
  var incr=true; // 首轮用增量组ID免链BFS; 一旦有死子(组结构失效)退回BFS
  for(var iter=0;iter<5;iter++){
    var st=++goRStamp,nc=0; // goRScr计数器必须用goRStamp(与goRPlay共用)
    // 1. 逻辑分组剩余棋子(增量模式: 直接用goRId)
    if(incr){
      goRGEye.fill(0,0,goRNextG);
    }else{
      for(var p=0;p<GSZ*GSZ;p++){
        if(goRB[p]===0||goRScr[p]===st)continue;
        var c=goRB[p],cid=nc++;
        goRDCol[cid]=c;goRDEye[cid]=0;
        var qh=0,qt=0;
        goRScrQ[qt++]=p;goRScr[p]=st;goRDG[p]=cid;
        while(qh<qt){
          var cur=goRScrQ[qh++];
          var nn=goRNbN[cur],cb=cur*4;
          for(var i=0;i<nn;i++){
            var n=goRNbF[cb+i];
            if(goRB[n]===c&&goRScr[n]!==st){goRScr[n]=st;goRDG[n]=cid;goRScrQ[qt++]=n}
          }
        }
      }
    }
    // 2. 空区域分析: 单色邻接区域给该色所有邻接链加眼位
    var rst=++goRCapSt;
    for(var p2=0;p2<GSZ*GSZ;p2++){
      if(goRB[p2]!==0||goRCapM[p2]===rst)continue;
      var qh2=0,qt2=0,size=0,monoC=-1,mixed=false,nbc=0;
      goRScrQ[qt2++]=p2;goRCapM[p2]=rst;
      while(qh2<qt2){
        var cur2=goRScrQ[qh2++];size++;
        var nn2=goRNbN[cur2],cb2=cur2*4;
        for(var i2=0;i2<nn2;i2++){
          var n2=goRNbF[cb2+i2],v2=goRB[n2];
          if(v2===0){
            if(goRCapM[n2]!==rst){goRCapM[n2]=rst;goRScrQ[qt2++]=n2}
          }else{
            var cid2=incr?goRId[n2]:goRDG[n2];
            var dup=false;
            for(var k=0;k<nbc;k++)if(goRDNbC[k]===cid2){dup=true;break}
            if(!dup&&nbc<64)goRDNbC[nbc++]=cid2;
            if(monoC===-1)monoC=v2;
            else if(monoC!==v2)mixed=true;
          }
        }
      }
      if(!mixed&&monoC>=0){
        var contrib=size>=3?2:1;
        if(incr){for(var k2=0;k2<nbc;k2++)goRGEye[goRDNbC[k2]]+=contrib}
        else{for(var k2b=0;k2b<nbc;k2b++)goRDEye[goRDNbC[k2b]]+=contrib}
      }
    }
    // 3. 眼位<2的链判死移除
    var dead=false;
    for(var p3=0;p3<GSZ*GSZ;p3++){
      if(goRB[p3]===0)continue;
      var ey=incr?goRGEye[goRId[p3]]:goRDEye[goRDG[p3]];
      if(ey<2){goRB[p3]=0;dead=true}
    }
    if(!dead)break;
    incr=false;
  }
}
// 终局计分(中国规则,区域归属+死子清理): 返回refColor胜率
function goRFinalScore(refColor){
  goRCleanDead();
  var st=++goRCapSt,bk=0,wt=0;
  var q=goRScrQ;
  for(var p=0;p<GSZ*GSZ;p++){
    var v=goRB[p];
    if(v===1){bk++;continue}
    if(v===2){wt++;continue}
    if(goRCapM[p]===st)continue;
    var qh=0,qt=0,cnt=0,b1=false,b2=false;
    goRCapM[p]=st;q[qt++]=p;
    while(qh<qt){
      var cur=q[qh++];
      cnt++;
      var nn=goRNbN[cur],cb=cur*4;
      for(var i=0;i<nn;i++){
        var n=goRNbF[cb+i],nv=goRB[n];
        if(nv===0){
          if(goRCapM[n]!==st){goRCapM[n]=st;q[qt++]=n}
        }else if(nv===1)b1=true;else b2=true;
      }
    }
    if(b1&&!b2)bk+=cnt;else if(b2&&!b1)wt+=cnt;
  }
  wt+=7.5;
  var d=bk-wt;
  return refColor===1?d:-d; // 返回refColor视角分差(均值无偏, MCTS分差回传)
}
// Rollout: 局部应手(上一手邻域1气组)+融合抽样加权; recMv/recC记录全程着法(AMAF)
// goRSampleW: 单遍邻居扫描融合眼判定/模式/提子/救子, 眼返回-1
function goRSampleW(p,c){
  var nb=goRNbF,nn=goRNbN[p],pb=p*4;
  var x=(p/GSZ)|0,y=p%GSZ;
  var own=0,opn=0,cap=0,sav=0,wFill=0;
  for(var j=0;j<nn;j++){
    var n=nb[pb+j],v=goRB[n];
    if(v===0)continue;
    var g=goRId[n];
    if(goRLibC[g]===1&&!goROvf[g]){
      if(v===c){own++;sav++}else{opn++;cap++}
    }else if(v===c)own++;
    else{
      opn++;
      if(!goROvf[g]&&goRLibC[g]<=3)wFill+=(4-goRLibC[g]); // 气越少围杀越近
    }
  }
  if(own===nn){ // 候选可能是真眼: 对角检查
    var sc=0,wl=0;
    for(var dx=-1;dx<=1;dx+=2)for(var dy=-1;dy<=1;dy+=2){
      var nx=x+dx,ny=y+dy;
      if(nx<0||nx>=GSZ||ny<0||ny>=GSZ)wl++;
      else if(goRB[nx*GSZ+ny]===c)sc++;
      else wl++;
    }
    if(wl>0){if(sc+wl>=4)return -1}
    else if(sc>=3)return -1;
    return -2; // 己方包围但非真眼(打劫眼): 降权
  }
  var w=1;
  if(own>=1)w+=0.5;
  if(own>=2)w+=0.3;
  if(opn>=1)w+=0.4;
  if(cap>0)w+=3;
  if(sav>0)w+=1.5;
  if(wFill>0)w+=Math.min(2,wFill*0.4); // 围杀敌弱链(按气数加权)
  if(opn===0&&own>=1)w=Math.min(w,0.15); // 己方势力内部: 硬下限(低于pass阈值0.25)
  var edge=Math.min(x,y,GSZ-1-x,GSZ-1-y);
  if(edge===2)w+=0.15;
  else if(edge===3)w+=0.25;
  else if(edge===0)w*=0.3;
  else if(edge===1)w*=0.6;
  return w;
}
// rollout专用xorshift32(比Math.random快, 跨模拟连续推进避免同序列)
var goRSd=(Date.now()*2654435761)>>>0||1;
function goRRnd(){goRSd^=goRSd<<13;goRSd^=goRSd>>>17;goRSd^=goRSd<<5;return (goRSd>>>0)/4294967296}
function goRSim(startColor,koPos,maxMoves,recMv,recC){
  var sc=startColor,sk=koPos,pass=0,mc=0;
  var nb=goRNbF,nbn=goRNbN,L=goRNearList;
  while(pass<2&&mc<maxMoves){
    if(L.length>700)goRNearRebuild();
    else if((mc&31)===31&&L.length>60){ // 就地压缩: 剔除已占用点, 提升抽样命中率
      var w0=0;
      for(var c2=0;c2<L.length;c2++){var pp=L[c2];if(goRB[pp]===0)L[w0++]=pp}
      L.length=w0;
    }
    var nl=L.length;
    if(nl===0){pass++;sk=-1;sc=3-sc;mc++;continue}
    var opp=3-sc;
    var mv=-1,bw=-1;
    // 全局叫吃应手: 敌1气组→提(权10), 己1气组→逃(权6, 逃后有气才逃)
    if(goRAtariN>0){
      if((mc&63)===0&&goRAtariN>24)goRCompact();
      for(var a=0;a<goRAtariN;a++){
        var ag=goRAtariL[a];
        if(!goRAtariV[ag])continue;
        var tp=goRLibs[ag*GO_MAXL];
        if(goRB[tp]!==0||tp===sk)continue;
        if(goRGCol[ag]===opp){
          if(10>bw){bw=10;mv=tp}
        }else{
          var esc=0,tb=tp*4,tn=nbn[tp];
          for(var e=0;e<tn;e++){
            var en=nb[tb+e],ev=goRB[en];
            if(ev===0)esc++;
            else if(ev===opp){var eg2=goRId[en];if(goRLibC[eg2]===1&&!goROvf[eg2])esc++}
          }
          if(esc>0&&6>bw){bw=6;mv=tp}
        }
      }
    }
    // 抽样候选: 融合权重(眼→跳过, 打劫眼→低权); 低权点(<0.25)不接受
    var tries=Math.min(14,nl<<1);
    for(var t=0;t<tries;t++){
      var p=L[(goRRnd()*nl)|0];
      if(goRB[p]!==0)continue;
      var w=goRSampleW(p,sc);
      if(w<0){
        if(w===-1)continue;
        w=0.3;
      }
      if(w<0.25)continue;
      if(w>bw){bw=w;mv=p}
    }
    if(mv<0){
      // 兜底全量扫描: 找权重>=0.25的点(找不到→pass, 不填己方内部)
      var st2=(goRRnd()*nl)|0;
      for(var t2=0;t2<nl;t2++){
        var p2=L[(st2+t2)%nl];
        if(goRB[p2]!==0)continue;
        var w2=goRSampleW(p2,sc);
        if(w2===-1)continue;
        if(w2===-2)w2=0.3;
        if(w2>=0.25){mv=p2;bw=w2;break}
      }
    }
    if(mv<0){pass++;sk=-1;sc=3-sc;mc++;continue}
    var r=goRPlay(mv,sc,sk);
    if(r===-2){pass++;sk=-1}
    else{
      sk=r>=0?r:-1;pass=0;
      if(recMv){recMv.push(mv);recC.push(sc)}
    }
    sc=3-sc;mc++;
  }
  var fd=goRFinalScore(startColor);
  return fd>30?30:(fd<-30?-30:fd); // 限幅压方差(墙死±350极值→±30)
}
// 候选加权排序: goRSampleW权重 + 叫吃战术加成(按棋块大小成比例先验), 降序截断cap
// 返回[点,排序权重,战术虚拟访问数,战术先验值]
function goRNodeCands(cl,mover,koPos,cap){
  var wl=[],i;
  for(i=0;i<cl.length;i++){
    var p=cl[i];
    if(goRB[p]!==0)continue;
    var w=goRSampleW(p,mover);
    if(w===-1)continue;
    if(w===-2)w=0.5;
    wl.push([p,w,0,0]);
  }
  if(goRAtariN>0){
    for(var a=0;a<goRAtariN;a++){
      var ag=goRAtariL[a];
      if(!goRAtariV[ag])continue;
      var tp=goRLibs[ag*GO_MAXL];
      if(goRB[tp]!==0||tp===koPos)continue;
      var sz=0,m2=goRHead[ag];
      while(m2>=0){sz++;m2=goRNext[m2]}
      var tvv=0,tpv=0,ord=0;
      if(goRGCol[ag]!==mover){ // 提敌: 价值≈1.2×子数+1
        tvv=16;tpv=1.2*sz+1;ord=4;
      }else{
        var esc=0,tbn=tp*4,tn=goRNbN[tp];
        for(var e=0;e<tn;e++){
          var en=goRNbF[tbn+e],ev=goRB[en];
          if(ev===0)esc++;
          else if(ev!==mover){var eg=goRId[en];if(goRLibC[eg]===1&&!goROvf[eg])esc+=2}
        }
        if(esc>=2){tvv=8;tpv=1.2*sz;ord=3} // 逃己: 价值≈1.2×子数
      }
      if(tvv<=0)continue;
      var got=false;
      for(i=0;i<wl.length;i++)if(wl[i][0]===tp){
        wl[i][1]+=ord;
        if(wl[i][2]<tvv){wl[i][2]=tvv;wl[i][3]=tpv}
        got=true;break;
      }
      if(!got)wl.push([tp,2+ord,tvv,tpv]);
    }
  }
  wl.sort(function(a,b){return b[1]-a[1]});
  if(wl.length>cap)wl.length=cap;
  return wl;
}
// 节点创建: color=该节点move的落子方; 候选=下一手(3-color)按先验排序, rave虚拟访问(战术点加权)
function goRNewNode(parent,mv,color,koPos,cap,cl){
  var nxt=3-color;
  if(cl===undefined)cl=goRCands(nxt);
  var wl=goRNodeCands(cl,nxt,koPos,cap);
  var node={parent:parent,move:mv,color:color,children:[],visits:0,wins:0,untried:[],raveV:{},raveW:{},di:parent?parent.di+1:0};
  for(var i=0;i<wl.length;i++){
    var vv=wl[i][2]>0?wl[i][2]:4;
    var pv=wl[i][2]>0?wl[i][3]:Math.max(-4,Math.min(8,(wl[i][1]-1)*2.5));
    node.untried.push(wl[i][0]);
    node.raveV[wl[i][0]]=vv;
    node.raveW[wl[i][0]]=vv*pv;
  }
  return node;
}
// ============================================================
//  根级战术层: 叫吃应手(逃子/提子/反提/倒扑安全检查) + 征子读取
//  MCTS的rollout分差噪声(±30)远大于单次叫吃价值(~2分), 纯统计搜索
//  不可靠 → 战术局面用确定性应手, 杜绝"看不见叫吃"的低级失误
// ============================================================
function _lgGrp(bd,x,y){
  var c=bd[x][y];if(c===0)return null;
  var vis={},st=[],lb={},q=[[x,y]],qh=0;vis[x*GSZ+y]=1;
  while(qh<q.length){
    var cu=q[qh++];st.push(cu);
    var ns=goNb(cu[0],cu[1]);
    for(var i=0;i<ns.length;i++){
      var nx=ns[i][0],ny=ns[i][1],k=nx*GSZ+ny,v=bd[nx][ny];
      if(v===0)lb[k]=1;
      else if(v===c&&!vis[k]){vis[k]=1;q.push([nx,ny])}
    }
  }
  var lk=Object.keys(lb),ls=[];
  for(var j=0;j<lk.length;j++){var kk=+lk[j];ls.push([(kk/GSZ)|0,kk%GSZ])}
  return{stones:st,libs:ls,color:c};
}
function _lgPlay(bd,x,y,c){
  if(bd[x][y]!==0)return -1;
  bd[x][y]=c;
  var opp=3-c,caps=0,ns=goNb(x,y);
  for(var i=0;i<ns.length;i++){
    var nx=ns[i][0],ny=ns[i][1];
    if(bd[nx][ny]===opp){
      var g=_lgGrp(bd,nx,ny);
      if(g&&g.libs.length===0){
        for(var j=0;j<g.stones.length;j++){bd[g.stones[j][0]][g.stones[j][1]]=0;caps++}
      }
    }
  }
  var og=_lgGrp(bd,x,y);
  if(og.libs.length===0){bd[x][y]=0;return -1} // 自杀(此分支caps必为0)
  return caps;
}
var _ladN=0;
// 征子判定: bd上(x,y)组被attacker追杀, 返回true=逃不掉
// 攻方优先占两气叫吃, 守方可逃单气点或反提攻方1气组; 深度+节点预算防爆炸
function goLadderCaught(bd,x,y,attacker,depth){
  var g=_lgGrp(bd,x,y);
  if(!g)return true;
  var L=g.libs.length;
  if(L>=3)return false;      // 气够, 逃掉
  if(L<=1)return true;       // 已叫吃(攻方下一手提)
  if(depth>50||_ladN>1200)return false; // 预算耗尽按逃掉算(保守)
  _ladN++;
  var def=g.color;
  for(var li=0;li<L;li++){
    var lp=g.libs[li];
    var b2=[];
    for(var r=0;r<GSZ;r++)b2.push(bd[r].slice());
    if(_lgPlay(b2,lp[0],lp[1],attacker)<0)continue;
    var g2=_lgGrp(b2,x,y);
    if(!g2)return true;
    if(g2.libs.length>=3)continue; // 这手没叫吃到(被反提等), 换气
    // 守方应手: 逃最后一口气 + 反提邻接的攻方1气组
    var dmoves=[],seenM={};
    if(g2.libs.length===1){
      var mp=g2.libs[0];seenM[mp[0]*GSZ+mp[1]]=1;dmoves.push(mp);
    }
    for(var si=0;si<g2.stones.length;si++){
      var stn=g2.stones[si],sns=goNb(stn[0],stn[1]);
      for(var ni=0;ni<sns.length;ni++){
        var sn=sns[ni];
        if(b2[sn[0]][sn[1]]===attacker){
          var ag=_lgGrp(b2,sn[0],sn[1]);
          if(ag.libs.length===1){
            var mp2=ag.libs[0],mk=mp2[0]*GSZ+mp2[1];
            if(!seenM[mk]){seenM[mk]=1;dmoves.push(mp2)}
          }
        }
      }
    }
    var esc=false;
    for(var di=0;di<dmoves.length;di++){
      var dm=dmoves[di];
      var b3=[];
      for(var r2=0;r2<GSZ;r2++)b3.push(b2[r2].slice());
      if(_lgPlay(b3,dm[0],dm[1],def)<0)continue;
      var g3=_lgGrp(b3,x,y);
      if(!g3)continue;
      if(g3.libs.length>=3){esc=true;break}
      if(!goLadderCaught(b3,x,y,attacker,depth+1)){esc=true;break}
    }
    if(!esc)return true; // 这手叫吃后守方无路 → 征子成立
  }
  return false;
}
function goRSnapB(){
  var nb=[];
  for(var xx=0;xx<GSZ;xx++){
    var row=new Array(GSZ);
    for(var yy=0;yy<GSZ;yy++)row[yy]=goRB[xx*GSZ+yy];
    nb.push(row);
  }
  return nb;
}
// 战术应手: 返回{p,tag}或null(局面无1气组或无可行应手)
function goTactical(b,c,ko){
  goRLoad(b);
  var koPos=ko?ko.x*GSZ+ko.y:-1;
  var opp=3-c;
  var myAt=[],opAt=[];
  for(var g=1;g<goRNextG;g++){
    if(goRHead[g]<0)continue;
    if(goRLibC[g]!==1||goROvf[g])continue;
    var tp=goRLibs[g*GO_MAXL];
    if(goRB[tp]!==0)continue;
    if(goRGCol[g]===c)myAt.push([g,tp]);else opAt.push([g,tp]);
  }
  if(myAt.length===0&&opAt.length===0)return null;
  function grpSize(gi){var n=0,m=goRHead[gi];while(m>=0){n++;m=goRNext[m]}return n}
  function simPlay(p){ // 模拟我方落p(每次从原局面重载): {caps,libs}或null=非法
    goRLoad(b);
    var r=goRPlay(p,c,koPos);
    if(r===-2)return null;
    var caps=0;
    for(var q=0;q<GSZ*GSZ;q++){
      if(b[(q/GSZ)|0][q%GSZ]===opp&&goRB[q]===0)caps++;
    }
    var ng=goRId[p];
    return{caps:caps,libs:goROvf[ng]?99:goRLibC[ng]};
  }
  var best=null,bestV=0;
  // 1) 我方1气组: 逃(≥3气直接逃, 2气需征子判定) / 反提邻接敌组救活
  for(var i=0;i<myAt.length;i++){
    var g3=myAt[i][0],tp3=myAt[i][1];
    var sz=grpSize(g3);
    var one=goRHead[g3]; // 组内任一子(反提后存活校验)
    var sim=simPlay(tp3);
    if(sim){
      if(sim.caps>0){ // 逃点同时提敌(对杀胜/反提)
        if(sim.libs>=2){var v=sz+sim.caps+1;if(v>bestV){bestV=v;best={p:tp3,tag:'对杀提子'}}}
      }else if(sim.libs>=3){
        var v2=sz+1;if(v2>bestV){bestV=v2;best={p:tp3,tag:'逃叫吃'}}
      }else if(sim.libs===2){
        var nb=goRSnapB(); // sim后局面(逃出后)
        _ladN=0;
        if(!goLadderCaught(nb,(tp3/GSZ)|0,tp3%GSZ,opp,0)){
          var v3=sz+1;if(v3>bestV){bestV=v3;best={p:tp3,tag:'逃叫吃'}}
        }
        // 逃不掉(被征死)→ 不逃, 防止越跑损失越大
      }
    }
    // 反提救活: 提掉紧我气的敌1气组, 我组重获气
    var m4=goRHead[g3];
    var seenEg={};
    while(m4>=0){
      var mx=(m4/GSZ)|0,my=m4%GSZ,ns4=goNb(mx,my);
      for(var ni=0;ni<ns4.length;ni++){
        var nn=ns4[ni];
        if(b[nn[0]][nn[1]]===opp){
          var eg=_lgGrp(b,nn[0],nn[1]);
          if(eg&&eg.libs.length===1){
            var cp=eg.libs[0];
            var simc=simPlay(cp[0]*GSZ+cp[1]);
            if(simc&&simc.caps>0&&goRB[one]===c){
              var og=goRId[one];
              var ol=goROvf[og]?99:goRLibC[og];
              if(ol>=2){
                var v4=sz+simc.caps+1;
                if(v4>bestV){bestV=v4;best={p:cp[0]*GSZ+cp[1],tag:'反提救活'}}
              }
            }
          }
        }
      }
      m4=goRNext[m4];
    }
  }
  // 2) 敌方1气组: 提子(≥2气安全; 1气需倒扑检查)
  for(var j=0;j<opAt.length;j++){
    var g5=opAt[j][0],tp5=opAt[j][1];
    var sim5=simPlay(tp5);
    if(!sim5)continue;
    var caps5=sim5.caps; // ≥1
    if(sim5.libs>=2){
      var v5=caps5+1;if(v5>bestV){bestV=v5;best={p:tp5,tag:'提子'}}
    }else if(sim5.libs===1){
      // 倒扑: 对方下一手反提我组, 净损则不提
      var nb5=goRSnapB();
      var lg=_lgGrp(nb5,(tp5/GSZ)|0,tp5%GSZ);
      if(lg&&lg.libs.length===1){
        var b5=[];
        for(var r5=0;r5<GSZ;r5++)b5.push(nb5[r5].slice());
        var rec=_lgPlay(b5,lg.libs[0][0],lg.libs[0][1],opp);
        if(rec>0){
          if(caps5-rec>0){var v6=caps5-rec+1;if(v6>bestV){bestV=v6;best={p:tp5,tag:'提子'}}}
        }else{
          var v7=caps5+1;if(v7>bestV){bestV=v7;best={p:tp5,tag:'提子'}}
        }
      }
    }
  }
  return best;
}
// ============================================================
//  MCTS树复用: 连续两手之间保留对应子树(访问数/RAVE统计全部继承)
//  等效模拟数提升一倍以上; 局面不匹配(悔棋/新局)自动回退全新搜索
// ============================================================
var goTRoot=null,goTBase=null,goTKo=null,goTMove=-1,goTColor=0;
var goTReuseCnt=0; // 诊断: 树复用生效次数
function goTReset(){goTRoot=null;goTBase=null;goTKo=null;goTMove=-1;goTColor=0}
function goTBoardsEq(a,bb){
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++)if(a[x][y]!==bb[x][y])return false;
  return true;
}
function goTFixDepths(n,d){
  n.di=d;
  for(var i=0;i<n.children.length;i++)goTFixDepths(n.children[i],d+1);
}
// 回放验证: 上一手树中找到"我方着法→对方实际应手"的子节点提升为新根
function goTPromote(b,c,koPos){
  if(!goTRoot||!goTBase||goTMove<0||goTColor!==c)return null;
  goRLoad(goTBase);
  var koPrev=goTKo?goTKo.x*GSZ+goTKo.y:-1;
  var r=goRPlay(goTMove,c,koPrev);
  if(r===-2)return null;
  var koAfter=r>=0?r:-1;
  var cm=null;
  for(var i=0;i<goTRoot.children.length;i++){
    if(goTRoot.children[i].move===goTMove){cm=goTRoot.children[i];break}
  }
  if(!cm)return null;
  var snap=goRSnapB();
  if(goTBoardsEq(snap,b))return null; // 对方pass: 提升节点候选方向不符, 放弃复用
  var opp=3-c;
  for(var j=0;j<cm.children.length;j++){
    var co=cm.children[j];
    goRLoad(snap);
    var rr=goRPlay(co.move,opp,koAfter);
    if(rr===-2)continue;
    if(goTBoardsEq(goRSnapB(),b)){
      goTFixDepths(co,0);co.parent=null;return co;
    }
  }
  return null;
}
// 增强MCTS + RAVE(AMAF含rollout全程) + 根先验 + 快引擎 + 树复用 + 根级战术层
function goMCTS(b,c,ko,onMCTSResult){
  if(curDiff>=2){
    var joseki=goMatchJoseki(b);
    if(joseki){
      showAIInfo('<span class="tag">定式</span> 角部定式应手');
      onMCTSResult({move:[joseki.x,joseki.y]});return;
    }
  }
  goRLoad(b);
  var koPos=ko?ko.x*GSZ+ko.y:-1;
  var cnt=0;
  for(var p0=0;p0<GSZ*GSZ;p0++)if(goRB[p0]!==0)cnt++;
  if(cnt===0){
    goTReset();
    var ST0=[[3,3],[3,15],[15,3],[15,15],[9,9]];
    var sp=ST0[(Math.random()*ST0.length)|0];
    showAIInfo('<span class="tag">布局</span> 星位开局');
    onMCTSResult({move:[sp[0],sp[1]]});return;
  }
  // 根级战术层: 1气组确定性应手(逃/提/反提), 不进入统计搜索
  var tac=goTactical(b,c,ko);
  if(tac){
    var tx=(tac.p/GSZ)|0,ty=tac.p%GSZ;
    if(goTry(b,tx,ty,c,ko).valid){
      showAIInfo('<span class="tag">战术</span> '+tac.tag);
      onMCTSResult({move:[tx,ty]});return;
    }
  }
  var um=goRCands(c);
  if(um.length===0){
    um=[];
    for(var p1=0;p1<GSZ*GSZ;p1++){
      if(goRB[p1]!==0)continue;
      if(goRIsEye(p1,c))continue;
      um.push(p1);
    }
  }
  if(um.length===0){onMCTSResult(null);return}
  var ST=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
  if(cnt<=8){
    var gm=[];
    for(var i=0;i<um.length;i++){
      var x=(um[i]/GSZ)|0,y=um[i]%GSZ;
      for(var j=0;j<ST.length;j++)if(ST[j][0]===x&&ST[j][1]===y){gm.push(um[i]);break}
    }
    if(gm.length>0)um=gm;
  }
  var SIMS=curDiff===1?6000:curDiff===2?25000:curDiff===3?60000:150000;
  var TLIMIT=curDiff===1?2000:curDiff===2?3500:curDiff===3?5500:8000;
  var MAXSIM=Math.min(600,Math.max(150,650-cnt));
  // 树复用: 匹配上一手子树则继承全部统计, 否则全新根
  var root=goTPromote(b,c,koPos);
  var reused=root!==null;
  if(reused)goTReuseCnt++;
  if(!root)root=goRNewNode(null,null,3-c,koPos,20,um);
  var nodes=0,si=0;
  var mctsStart=Date.now();
  var PMv=[],PMC=[];
  function runChunk(){
    if(goAbort){onDone();return}
    var chunkStart=Date.now();
    var s=si,timeUp=false;
    for(;s<SIMS;s++){
      if((s&31)===0&&Date.now()-mctsStart>TLIMIT){timeUp=true;break}
      goRLoad(b); // 恢复根局面(全量重建免快照)
      var node=root,sk=koPos;
      PMv.length=0;PMC.length=0;
      while(true){
        // 渐进加宽: 先验排序候选, 访问数达2×子节点数才扩新子(防星形退化树)
        if(node.untried.length>0&&(node.children.length===0||node.visits>=node.children.length*2)){
          var mv=null;
          while(node.untried.length>0){
            mv=node.untried.shift();
            var r2=goRPlay(mv,3-node.color,sk);
            if(r2===-2){mv=null;continue}
            sk=r2>=0?r2:-1;
            PMv.push(mv);PMC.push(3-node.color);
            break;
          }
          if(mv!==null){
            var child=goRNewNode(node,mv,3-node.color,sk,32);
            node.children.push(child);
            node=child;
          }
          break;
        }
        if(node.children.length>0){
          var best=null,bv=-Infinity;
          for(var i=0;i<node.children.length;i++){
            var ch=node.children[i];
            if(ch.visits===0){best=ch;break}
            var mcVal=ch.wins/ch.visits;
            var mk=ch.move;
            var raveN=node.raveV[mk]||0,raveW=node.raveW[mk]||0;
            var raveVal=raveN>0?raveW/raveN:0;
            var beta=raveN/(raveN+ch.visits+ch.visits*raveN/30); // 衰减式: 访问增多后AMAF让位于mcVal
            var q=(1-beta)*mcVal+beta*raveVal;
            var ucbExpl=curDiff>=4?5:curDiff>=3?6:7;var ucb=q+ucbExpl*Math.sqrt(Math.log(node.visits)/ch.visits); // 分差量纲探索系数
            if(ucb>bv){bv=ucb;best=ch}
          }
          if(!best)break;
          var r=goRPlay(best.move,best.color,sk);
          if(r===-2)break;
          sk=r>=0?r:-1;
          PMv.push(best.move);PMC.push(best.color);
          node=best;
          continue;
        }
        break;
      }
      var simStart=3-node.color;
      var sr=goRSim(simStart,sk,MAXSIM,PMv,PMC);
      var n=node;
      while(n!==null){
        n.visits++;
        var wp=(n.color===simStart)?sr:-sr;
        n.wins+=wp;
        var pm=3-n.color,pend=Math.min(PMv.length,n.di+12); // AMAF窗口12手: 远处着法与节点语境无关
        for(var pj=n.di;pj<pend;pj++){
          if(PMC[pj]===pm){
            var mk2=PMv[pj];
            n.raveV[mk2]=(n.raveV[mk2]||0)+1;
            n.raveW[mk2]=(n.raveW[mk2]||0)-wp; // 值取-candidates颜色视角(与先验一致)
          }
        }
        n=n.parent;
      }
      nodes++;
      if((s&7)===7&&Date.now()-chunkStart>22)break;
    }
    si=s;
    if(si<SIMS&&!goAbort&&!timeUp){setTimeout(runChunk,0)}
    else{onDone()}
  }
  function onDone(){
    var bn=null,bvis=-1;
    for(var i=0;i<root.children.length;i++){
      if(root.children[i].visits>bvis){bvis=root.children[i].visits;bn=root.children[i]}
    }
    if(typeof goDBG!=='undefined'&&goDBG){
      var dc=root.children.slice();
      dc.sort(function(a,b){return b.visits-a.visits});
      console.log('[DBG] sims='+si+' nodes='+nodes+' rootChildren='+root.children.length);
      for(var d=0;d<Math.min(12,dc.length);d++){
        var cn=dc[d],mk3=cn.move;
        var rv=root.raveV[mk3]||0,rw=root.raveW[mk3]||0;
        console.log('[DBG] #'+d+' ('+((mk3/GSZ)|0)+','+(mk3%GSZ)+') v='+cn.visits+' mean='+(cn.wins/cn.visits).toFixed(2)+' raveN='+rv+' raveVal='+(rv>0?(rw/rv).toFixed(2):'-'));
      }
    }
    var info='<span class="tag">MCTS</span> '+si+'次模拟 '+nodes+'节点'+(reused?' <span class="tag">树复用</span>':'');
    if(bn){
      var sd=bn.wins/bn.visits;
      info+=' 预估分差'+(sd>=0?'+':'')+sd.toFixed(1);
      // 保存树供下一手复用(回放验证失败自动回退)
      goTRoot=root;goTBase=b;goTKo=ko;goTMove=bn.move;goTColor=c;
    }else goTReset();
    showAIInfo(info);
    onMCTSResult(bn?{move:[(bn.move/GSZ)|0,bn.move%GSZ]}:null);
  }
  setTimeout(runChunk,0);
}
// 对局终局计分(中国规则+死子清理): 覆盖旧版"无死子判定"实现
function goScore(b){
  goRLoad(b);
  goRCleanDead();
  var st=++goRCapSt,bk=0,wt=0,q=goRScrQ;
  for(var p=0;p<GSZ*GSZ;p++){
    var v=goRB[p];
    if(v===1){bk++;continue}
    if(v===2){wt++;continue}
    if(goRCapM[p]===st)continue;
    var qh=0,qt=0,cnt=0,b1=false,b2=false;
    goRCapM[p]=st;q[qt++]=p;
    while(qh<qt){
      var cur=q[qh++];
      cnt++;
      var nn=goRNbN[cur],cb=cur*4;
      for(var i=0;i<nn;i++){
        var n=goRNbF[cb+i],nv=goRB[n];
        if(nv===0){
          if(goRCapM[n]!==st){goRCapM[n]=st;q[qt++]=n}
        }else if(nv===1)b1=true;else b2=true;
      }
    }
    if(b1&&!b2)bk+=cnt;else if(b2&&!b1)wt+=cnt;
  }
  wt+=7.5;
  return{black:bk,white:wt};
}
// 实时目数估算: 用领地估算(goTerr)快速计算,在棋盘上用彩色标记显示地盘归属
var goTerrVis=null; // 地盘可视化数据
function updateGoScore(){
  if(goOver||!goB)return;
  var t=goTerr(goB);
  goTerrVis=t;
  var bk=0,wt=0;
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    if(goB[x][y]!==0)continue;
    if(t[x][y]===1)bk++;else if(t[x][y]===2)wt++;
  }
  // 加上提子数
  var bkTotal=bk+goCaps[0];
  var wtTotal=wt+goCaps[1]+7.5;
  var total=bkTotal+wtTotal;
  var bkPct=Math.max(8,Math.min(92,bkTotal/total*100));
  var diff=bkTotal-wtTotal;
  var el=$('goscore');
  if(!el)return;
  el.style.display='block';
  var bar=el.querySelector('.gs-bar');
  bar.style.width=bkPct+'%';
  $('gsbk').textContent='黑 '+bkTotal.toFixed(1);

function goPlay(x,y){

function goEnd(){
  goOver=true;
  goTerrVis=null; // 清除地盘标记
  var alive=goBenson(goB);
  var t=goTerr(goB);
  // 识别死子: 不在活棋集中且所有气都在对方地盘中的棋串
  var aliveSet={};
  for(var c in alive){
    for(var i=0;i<alive[c].length;i++){
      for(var j=0;j<alive[c][i].stones.length;j++){
        aliveSet[alive[c][i].stones[j][0]*GSZ+alive[c][i].stones[j][1]]=parseInt(c);
      }
    }
  }
  var deadStones=[];
  var deadVisited={};
  for(var x=0;x<GSZ;x++)for(var y=0;y<GSZ;y++){
    var k=x*GSZ+y;
    if(goB[x][y]===0||deadVisited[k])continue;
    var c=goB[x][y];
    var grp=goGrp(goB,x,y);
    for(var j=0;j<grp.stones.length;j++)deadVisited[grp.stones[j][0]*GSZ+grp.stones[j][1]]=true;
    var isAlive=false;
    for(var j=0;j<grp.stones.length;j++){
      if(aliveSet[grp.stones[j][0]*GSZ+grp.stones[j][1]]===c){isAlive=true;break}
    }
    if(!isAlive&&grp.liberties.length>0){
      var allInOppTerr=true;
      for(var j=0;j<grp.liberties.length;j++){
        var lk=parseInt(grp.liberties[j]);
        var lx=Math.floor(lk/GSZ),ly=lk%GSZ;
        if(t[lx][ly]!==3-c){allInOppTerr=false;break}
      }
      if(allInOppTerr){
        for(var j=0;j<grp.stones.length;j++)deadStones.push(grp.stones[j]);
      }
    }
  }
  // 移除死子后重新计分
  var scoreB=goB.map(function(r){return r.slice()});
  for(var i=0;i<deadStones.length;i++)scoreB[deadStones[i][0]][deadStones[i][1]]=0;
  var s=goScore(scoreB);
  // 构建清晰的计分说明
  var deadBlack=0,deadWhite=0;
  for(var i=0;i<deadStones.length;i++){
    if(goB[deadStones[i][0]][deadStones[i][1]]===1)deadBlack++;else deadWhite++;
  }
  var lines=[];
  lines.push('━━━ 围棋计分 ━━━');
  lines.push('黑: 地盘'+(s.black-goCaps[0]).toFixed(0)+' + 提子'+goCaps[0] + (deadBlack>0?' + 死子'+deadBlack:'') + ' = '+s.black.toFixed(1)+'目');
  lines.push('白: 地盘'+(s.white-7.5-goCaps[1]).toFixed(0)+' + 提子'+goCaps[1] + (deadWhite>0?' + 死子'+deadWhite:'') + ' + 贴目7.5 = '+s.white.toFixed(1)+'目');
  lines.push('结果: 黑'+s.black.toFixed(1)+' 白'+s.white.toFixed(1));
  var diff=s.black-s.white;
  if(Math.abs(diff)<0.1)lines.push('和棋');
  else if(diff>0)lines.push('黑胜 '+diff.toFixed(1)+'目');
  else lines.push('白胜 '+(-diff).toFixed(1)+'目');
  var resultTxt=lines.join('\n');
  if(s.black>s.white){addS('w');showOver('胜',resultTxt,'win')}
  else if(s.white>s.black){addS('l');showOver('负',resultTxt,'lose')}
  else{showOver('和',resultTxt,'draw')}
}

// ============================================================

function xqInitBoard(){

}
var XV=[0,10000,200,200,400,900,450,100,10000,200,200,400,900,450,100];
var xqB,xqRed,xqSel,xqLegal,xqHist,xqOver,xqAi,xqTT,xqKiller,xqHist2,xqAiRed;
// 棋盘翻转: 人机对战中玩家执黑(后手)时自动旋转180°,使玩家棋子始终位于屏幕下方

function xqRedP(p){return p>=1&&p<=7}
function xqSame(a,b){return(a>=1&&a<=7&&b>=1&&b<=7)||(a>=8&&a<=14&&b>=8&&b<=14)}
function xqType(p){return p===0?0:(p<=7?p:p-7)}
function xqInB(r,c){return r>=0&&r<10&&c>=0&&c<9}
function xqPal(r,c,red){if(c<3||c>5)return false;return red?(r>=7&&r<=9):(r>=0&&r<=2)}
// 生成所有走法(不检查将军) capsOnly=true时只生成吃子走法(静态搜索用)
function xqGen(b,red,capsOnly){
  var m=[];
  for(var r=0;r<10;r++)for(var c=0;c<9;c++){
    var p=b[r][c];if(p===0)continue;
    if(red?p>=8:p<=7)continue; // 数值颜色判断(免xqRedP函数调用)
    xqGP(b,r,c,p,m,capsOnly);
  }
  return m;
}
// 走法方向表(模块级常量: 免每次调用重复分配数组, 消除GC压力)
var XQ_DIR4=[[-1,0],[1,0],[0,-1],[0,1]];
var XQ_KN_MV=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[-1,2,0,1],[1,-2,0,-1],[1,2,0,1]];
var XQ_BM_MV=[[-2,-2,-1,-1],[-2,2,-1,1],[2,-2,1,-1],[2,2,1,1]];
var XQ_AD_MV=[[-1,-1],[-1,1],[1,-1],[1,1]];
function xqGP(b,r,c,p,m,capsOnly){
  var co=!!capsOnly;
  function add(tr,tc){
    var cap=b[tr][tc];
    if(co&&cap===0)return;
    if(cap!==0&&xqSame(p,cap))return;
    m.push({fr:r,fc:c,tr:tr,tc:tc,piece:p,captured:cap});
  }
  var t=xqType(p),red=xqRedP(p);
  if(t===5){for(var i=0;i<4;i++){var nr=r+XQ_DIR4[i][0],nc=c+XQ_DIR4[i][1];while(xqInB(nr,nc)){if(b[nr][nc]===0)add(nr,nc);else{if(!xqSame(p,b[nr][nc]))add(nr,nc);break}nr+=XQ_DIR4[i][0];nc+=XQ_DIR4[i][1]}}}
  else if(t===4){for(var i=0;i<8;i++){var nr=r+XQ_KN_MV[i][0],nc=c+XQ_KN_MV[i][1];if(!xqInB(nr,nc))continue;if(b[r+XQ_KN_MV[i][2]][c+XQ_KN_MV[i][3]]!==0)continue;add(nr,nc)}}
  else if(t===3){for(var i=0;i<4;i++){var nr=r+XQ_BM_MV[i][0],nc=c+XQ_BM_MV[i][1];if(!xqInB(nr,nc))continue;if(red&&nr<5)continue;if(!red&&nr>4)continue;if(b[r+XQ_BM_MV[i][2]][c+XQ_BM_MV[i][3]]!==0)continue;add(nr,nc)}}
  else if(t===2){for(var i=0;i<4;i++){var nr=r+XQ_AD_MV[i][0],nc=c+XQ_AD_MV[i][1];if(!xqPal(nr,nc,red))continue;add(nr,nc)}}
  else if(t===1){for(var i=0;i<4;i++){var nr=r+XQ_DIR4[i][0],nc=c+XQ_DIR4[i][1];if(!xqPal(nr,nc,red))continue;add(nr,nc)}}
  else if(t===6){for(var i=0;i<4;i++){var nr=r+XQ_DIR4[i][0],nc=c+XQ_DIR4[i][1],jp=false;while(xqInB(nr,nc)){if(b[nr][nc]===0){if(!jp)add(nr,nc)}else{if(!jp)jp=true;else{if(!xqSame(p,b[nr][nc]))add(nr,nc);break}}nr+=XQ_DIR4[i][0];nc+=XQ_DIR4[i][1]}}}
  else if(t===7){var fwd=red?-1:1,nr=r+fwd;if(xqInB(nr,c))add(nr,c);var cr=red?r<=4:r>=5;if(cr){for(var dc=-1;dc<=1;dc+=2){var nc=c+dc;if(xqInB(r,nc))add(r,nc)}}}
}
function xqKing(b,red){var tg=red?1:8;for(var r=0;r<10;r++)for(var c=0;c<9;c++)if(b[r][c]===tg)return[r,c];return null}
// 增量王位跟踪: 搜索make/unmake时同步维护,免去每节点全盘找王(O(90)→O(1))
var xqKR=-1,xqKC=-1,xqBR=-1,xqBC=-1;
function xqKingSync(b){
  xqKR=-1;xqKC=-1;xqBR=-1;xqBC=-1;
  for(var r=0;r<10;r++)for(var c=0;c<9;c++){
    if(b[r][c]===1){xqKR=r;xqKC=c}
    else if(b[r][c]===8){xqBR=r;xqBC=c}
  }
}
// 从王位反向攻击检测: 4射线(车/炮/飞将)+8马位+3兵位,O(~40)格替代全盘扫描O(180)
// red=true → 检测红帅是否被黑方攻击
function xqAtt(b,kr,kc,red){
  var i,r,c,p;
  var D=[[-1,0],[1,0],[0,-1],[0,1]];
  for(i=0;i<4;i++){
    var dr=D[i][0],dc=D[i][1];
    r=kr+dr;c=kc+dc;
    var blk=0;
    while(r>=0&&r<10&&c>=0&&c<9){
      p=b[r][c];
      if(p!==0){
        if(blk===0){
          if(red?p===12:p===5)return true;           // 敌车照将
          if(dc===0&&(red?p===8:p===1))return true;  // 纵向对王(飞将)
          blk=1;
        }else{
          if(red?p===13:p===6)return true;           // 敌炮隔子照将
          break;
        }
      }
      r+=dr;c+=dc;
    }
  }
  // 马: 8个攻击位+蹩腿(腿位=马位向王方向长轴一格)
  var KN=[[2,1,1,1],[2,-1,1,-1],[-2,1,-1,1],[-2,-1,-1,-1],[1,2,1,1],[-1,2,-1,1],[1,-2,1,-1],[-1,-2,-1,-1]];
  var kn=red?11:4;
  for(i=0;i<8;i++){
    r=kr+KN[i][0];c=kc+KN[i][1];
    if(r<0||r>9||c<0||c>8)continue;
    if(b[r][c]!==kn)continue;
    if(b[kr+KN[i][2]][kc+KN[i][3]]===0)return true;
  }
  // 兵: 黑卒向下攻红帅/红兵向上攻黑将 + 过河横移
  var pw=red?14:7;
  if(red){
    if(kr>0&&b[kr-1][kc]===pw)return true;
    if(kc>0&&b[kr][kc-1]===pw)return true;
    if(kc<8&&b[kr][kc+1]===pw)return true;
  }else{
    if(kr<9&&b[kr+1][kc]===pw)return true;
    if(kc>0&&b[kr][kc-1]===pw)return true;
    if(kc<8&&b[kr][kc+1]===pw)return true;
  }
  return false;
}
function xqCheck(b,red){
  // 王位跟踪校验(棋盘上该位置确为本方王才有效,否则全盘重扫一次)
  if(xqKR<0||xqKR>9||xqKC<0||xqKC>8||b[xqKR][xqKC]!==1||xqBR<0||xqBR>9||xqBC<0||xqBC>8||b[xqBR][xqBC]!==8)xqKingSync(b);
  if(red){if(xqKR<0)return true;return xqAtt(b,xqKR,xqKC,true)}
  if(xqBR<0)return true;
  return xqAtt(b,xqBR,xqBC,false);
}
// make/unmake: 就地走子+王位增量跟踪(供搜索全程复用)
function xqMk(b,m){
  var cap=b[m.tr][m.tc];
  b[m.tr][m.tc]=b[m.fr][m.fc];b[m.fr][m.fc]=0;
  var p=b[m.tr][m.tc];
  if(p===1){xqKR=m.tr;xqKC=m.tc}
  else if(p===8){xqBR=m.tr;xqBC=m.tc}
  return cap;
}
function xqUm(b,m,cap){
  b[m.fr][m.fc]=b[m.tr][m.tc];b[m.tr][m.tc]=cap;
  var p=b[m.fr][m.fc];
  if(p===1){xqKR=m.fr;xqKC=m.fc}
  else if(p===8){xqBR=m.fr;xqBC=m.fc}
}
function xqLegalMoves(b,red){
  var all=xqGen(b,red),lg=[];

// Zobrist哈希
var xqZob=[];
for(var i=0;i<15*10*9;i++)xqZob.push((Math.random()*0xFFFFFFFF)>>>0);
var xqZobRed=(Math.random()*0xFFFFFFFF)>>>0;
function xqH(b,red){
  var h=red?xqZobRed:0;
  for(var r=0;r<10;r++)for(var c=0;c<9;c++){
    var p=b[r][c];if(p!==0)h^=xqZob[p*90+r*9+c];

}

var XQ_RP=[[14,14,12,18,16,18,12,14,14],[16,20,18,24,26,24,18,20,16],[12,12,12,18,18,18,12,12,12],[12,18,16,22,22,22,16,18,12],[12,14,12,18,18,18,12,14,12],[12,16,14,20,20,20,14,16,12],[6,10,8,14,14,14,8,10,6],[4,8,6,14,12,14,6,8,4],[8,4,8,16,8,16,8,4,8],[-2,10,6,14,12,14,6,10,-2]];
var XQ_KP=[[4,8,16,12,4,12,16,8,4],[4,10,28,16,8,16,28,10,4],[12,14,16,20,18,20,16,14,12],[8,24,18,24,20,24,18,24,8],[6,16,14,18,16,18,14,16,6],[4,12,16,14,12,14,16,12,4],[2,6,8,6,10,6,8,6,2],[4,2,8,8,4,8,8,2,4],[0,2,4,4,-2,4,4,2,0],[0,-4,0,0,0,0,0,-4,0]];

function xqFlip(t){var r=[];for(var i=9;i>=0;i--)r.push(t[i].slice());return r}
var XQ_PP_B=xqFlip(XQ_PP),XQ_RP_B=xqFlip(XQ_RP),XQ_KP_B=xqFlip(XQ_KP),XQ_CP_B=xqFlip(XQ_CP);

// 评估函数 — 单遍主循环完成物质+位置+马腿+炮架+王安全评估
// 性能: 王位/双车同线/兵车炮计数并入主循环, 消除原版末尾6次全盘扫描, 评估提速~3倍
function xqEval(b){
  var s=0,rk=-1,rc=-1,bk=-1,bc=-1;
  var redGuards=0,blkGuards=0,redEle=0,blkEle=0;
  var redCnt=0,blkCnt=0,redPawn=0,blkPawn=0,redRook=0,blkRook=0,redOff=0,blkOff=0;
  var rookCols=null;
  if(curDiff>=3)rookCols={};
  for(var r=0;r<10;r++)for(var c=0;c<9;c++){
    var p=b[r][c];if(p===0)continue;
    if(p===1){rk=r;rc=c;continue} // 帅(双方王值相抵,不入物质分)
    if(p===8){bk=r;bc=c;continue}
    var v=XV[p]+xqPV(p,r,c);
    switch(p){
      case 2:redGuards++;redCnt++;break;
      case 9:blkGuards++;blkCnt++;break;
      case 3:redEle++;redCnt++;break;
      case 10:blkEle++;blkCnt++;break;
      case 7: // 红兵
        redCnt++;redPawn++;
        if(r<=4)v+=curDiff>=3?50:30; // 过河兵
        if(r<=2)v+=20; // 兵临九宫
        break;
      case 14: // 黑卒
        blkCnt++;blkPawn++;
        if(r>=5)v+=curDiff>=3?50:30;
        if(r>=7)v+=20;
        break;
      case 4: // 红马: 蹩腿惩罚+位置
        redCnt++;redOff++;
        if(r>0&&b[r-1][c]!==0)v-=10;
        if(r<=1)v-=6;
        if(r>=3&&r<=6&&c>=3&&c<=5)v+=8; // 中心马
        if(r<=4)v+=10; // 过河马
        break;
      case 11: // 黑马
        blkCnt++;blkOff++;
        if(r<9&&b[r+1][c]!==0)v-=10;
        if(r>=8)v-=6;
        if(r>=3&&r<=6&&c>=3&&c<=5)v+=8;
        if(r>=5)v+=10;
        break;
      case 6: // 红炮: 中路有炮架+沉底炮
        redCnt++;redOff++;
        if(c===4){var fr=0;for(var r3=r+1;r3<10;r3++)if(b[r3][4]!==0)fr++;if(fr>=1)v+=12}
        if(r<=2&&c>=3&&c<=5)v+=10;
        if(r<=4)v-=9; // 过河无根炮: 深入敌阵易被吃回(有根时下方红兵/附近马已计入位置分, 净效果激励谨慎)
        break;
      case 13: // 黑炮
        blkCnt++;blkOff++;
        if(c===4){var fr2=0;for(var r4=r-1;r4>=0;r4--)if(b[r4][4]!==0)fr2++;if(fr2>=1)v+=12}
        if(r>=7&&c>=3&&c<=5)v+=10;
        if(r>=5)v-=9;
        break;
      case 5: // 红车
        redCnt++;redRook++;redOff++;
        if(rookCols){rookCols[c]=(rookCols[c]||0)+1;if(c===4)s+=8} // 占肋道
        break;
      case 12: // 黑车
        blkCnt++;blkRook++;blkOff++;
        if(rookCols){rookCols[c]=(rookCols[c]||0)-1;if(c===4)s-=8}
        break;
    }
    if(xqRedP(p))s+=v;else s-=v;
  }
  if(rk<0)return-99999;
  if(bk<0)return 99999;
  // 残局评估: 子力少时特殊处理
  var isEndgame=redCnt+blkCnt<=10;
  if(isEndgame){
    s+=redPawn*30;s-=blkPawn*30; // 残局中兵的价值大幅提升
    s-=redGuards*20;s-=redEle*20; // 残局中士象价值降低
    s+=blkGuards*20;s+=blkEle*20;
    s+=redRook*15;s-=blkRook*15; // 残局中车更活跃
  }else{
    // 开中局: 士象齐全防守稳固加分
    if(redGuards===2&&redEle===2)s+=15;
    if(blkGuards===2&&blkEle===2)s-=15;
  }
  // 车马炮的协同评估 (车马炮齐全为佳)
  if(redOff>=3)s+=25;
  if(blkOff>=3)s-=25;
  // 王安全评估: 帅在九宫中央(窝心)有惩罚 (王位已在主循环中取得)
  if(rk===7&&rc===4)s-=20; // 窝心帅
  if(rk===9&&rc===4)s-=8;  // 底线中帅
  var guards=0;
  if(rk>0&&b[rk-1]&&b[rk-1][rc]===2)guards++;
  if(rc>0&&b[rk][rc-1]===2)guards++;
  if(rc<8&&b[rk][rc+1]===2)guards++;
  s+=guards*8;
  if(bk===2&&bc===4)s+=20;
  if(bk===0&&bc===4)s+=8;
  var bguards=0;
  if(bk<9&&b[bk+1]&&b[bk+1][bc]===9)bguards++;
  if(bc>0&&b[bk][bc-1]===9)bguards++;
  if(bc<8&&b[bk][bc+1]===9)bguards++;
  s-=bguards*8;
  // 帅暴露惩罚(九宫内无士)
  if(guards===0)s-=25;
  if(bguards===0)s+=25;
  // 车骑河/巡河加分(控制要道)
  for(var c6=0;c6<9;c6++){
    if(b[4][c6]===5)s+=5;
    if(b[5][c6]===12)s-=5;
    if(b[6][c6]===5)s+=3;
    if(b[3][c6]===12)s-=3;
  }
  // 车的通路评估: 车在开放线上更有价值 + 兵林线/沉底 (直接查关键格,免嵌套循环)
  for(var c5=0;c5<9;c5++){
    var redR2=false,blkR2=false,blockers=0;
    for(var r5=0;r5<10;r5++){
      var q=b[r5][c5];
      if(q===5)redR2=true;
      else if(q===12)blkR2=true;
      else if(q!==0)blockers++;
    }
    if(redR2&&blockers<=2)s+=10;
    if(blkR2&&blockers<=2)s-=10;
    if(redR2){if(b[4][c5]===5)s+=6;if(b[0][c5]===5)s+=8} // 兵林线/沉底车
    if(blkR2){if(b[5][c5]===12)s-=6;if(b[9][c5]===12)s-=8}
  }
  // 高手及以上: 双车同线惩罚 (容易被兑)
  if(rookCols){
    for(var ck in rookCols){
      if(rookCols[ck]>=2)s-=12;
      if(rookCols[ck]<=-2)s+=12;
    }
  }
  // 开局发展评估: 子力完整时激励出子(车马炮离位), 抑制开局乱动炮/回马
  // 判定"开局": 双方大子齐全且未发生吃子(计数>=24指士象车马炮未损)
  if(redCnt+blkCnt>=24&&!isEndgame){
    // 红方未出动惩罚(黑视角反之): 车未离底线-15, 马未跳-10, 炮未动-8
    if(b[9][0]===5)s-=15; if(b[9][8]===5)s-=15;
    if(b[9][1]===4)s-=10; if(b[9][7]===4)s-=10;
    if(b[7][1]===6)s-=8; if(b[7][7]===6)s-=8;
    // 黑方未出动惩罚
    if(b[0][0]===12)s+=15; if(b[0][8]===12)s+=15;
    if(b[0][1]===11)s+=10; if(b[0][7]===11)s+=10;
    if(b[2][1]===13)s+=8; if(b[2][7]===13)s+=8;
    // 中炮原位(7,4)保留价值: 激励保持中路控制, 抑制开局随意平炮
    if(b[7][4]===6)s+=15;
    if(b[2][4]===13)s-=15;
  }
  return s;
}
// 走法排序: MVV-LVA + 杀手走法 + 历史启发
function xqOrderMoves(moves,ttMove,ply){
  for(var i=0;i<moves.length;i++){
    var m=moves[i],score=0;
    // 置换表最佳走法最优先
    if(ttMove&&m.fr===ttMove.fr&&m.fc===ttMove.fc&&m.tr===ttMove.tr&&m.tc===ttMove.tc)score+=100000;
    // MVV-LVA
    if(m.captured!==0){
      score+=10000+XV[m.captured]*10-XV[m.piece];
    }
    // 杀手走法
    if(xqKiller[ply]){
      for(var k=0;k<xqKiller[ply].length;k++){
        var km=xqKiller[ply][k];
        if(km&&m.fr===km.fr&&m.fc===km.fc&&m.tr===km.tr&&m.tc===km.tc){score+=9000;break}
      }
    }
    // 历史启发
    score+=xqHist2[m.fr*9+m.fc]&&xqHist2[m.fr*9+m.fc][m.tr*9+m.tc]||0;
    m.score=score;
  }
  moves.sort(function(a,b){return b.score-a.score});
}
// 时间限制(ms) — 效率提升后同样时长可搜更深;大师6s/高手4s/进阶2.5s/新手1.5s
function xqTimeLimit(){return curDiff>=4?10000:curDiff>=3?5500:curDiff===2?3000:1800}
// 静态搜索 (只搜吃子着法,被将军时搜全部应将着法) — make/unmake增量更新,免去棋盘复制
function xqQ(b,alpha,beta,red,qply){
  qply=qply||0;
  xqNodes++;
  if(xqAbort||(xqNodes&2047)===0&&Date.now()-xqStart>xqTimeLimit()){xqAbort=true;return 0}
  var inCheck=xqCheck(b,red);
  var stand=xqEval(b);
  if(!red)stand=-stand;
  if(qply>=(inCheck?10:6))return stand;
  if(!inCheck){
    if(stand>=beta)return beta;
    if(stand>alpha)alpha=stand;
  }
  var caps=inCheck?xqGen(b,red,false):xqGen(b,red,true);
  // MVV-LVA排序: 先吃高价值棋子
  caps.sort(function(a,b2){return(XV[b2.captured]*10-XV[b2.piece])-(XV[a.captured]*10-XV[a.piece])});
  var legalCnt=0;
  for(var i=0;i<caps.length;i++){
    var m=caps[i];
    // Delta剪枝: 吃该子后即使白得也追不上alpha → 跳过(不吃将军着法)
    if(!inCheck&&stand+XV[m.captured]+200<=alpha)continue;
    var cap=xqMk(b,m);
    if(xqCheck(b,red)){xqUm(b,m,cap);continue}
    legalCnt++;
    var sc=-xqQ(b,-beta,-alpha,!red,qply+1);
    xqUm(b,m,cap);
    if(xqAbort)return 0;
    if(sc>=beta)return beta;
    if(sc>alpha)alpha=sc;
  }
  // 将死/困毙: 当前行棋方无合法着法=判负(negamax当前方视角, 修复旧版黑方被将死返回+99000的符号反转bug)
  if(inCheck&&legalCnt===0)return -99000-qply;
  return alpha;
}
// PVS搜索 (主要变例搜索) — 伪合法走法+make后验将(免棋盘复制,NPS提升5倍+)
// pathSet: 搜索路径局面哈希集合,用于重复局面检测(防长将/长捉/循环)
var xqTTMax=2000000;
function xqPVS(b,depth,alpha,beta,red,ply,hIn,pathSet){
  xqNodes++;
  if(xqAbort||(xqNodes&2047)===0&&Date.now()-xqStart>xqTimeLimit()){xqAbort=true;return 0}
  // 置换表查询 (哈希由父节点增量传入,免去每节点90格重算)
  var h=(hIn===undefined||hIn===null)?xqH(b,red):(hIn>>>0);
  if(pathSet&&ply>0&&pathSet[h]===1)return 0; // 路径重复 → 按和棋分处理
  var tt=xqTT.get(h);
  if(tt&&tt.depth>=depth){
    if(tt.flag===0)return tt.score;
    if(tt.flag===1&&tt.score>=beta)return tt.score;
    if(tt.flag===2&&tt.score<=alpha)return tt.score;
  }
  // 将军检测
  var inCheck=xqCheck(b,red);
  // 将军延伸 (限制深度防止搜索爆炸)
  if(inCheck&&ply<40)depth++;
  if(ply>=64)return xqEval(b)*(red?1:-1);
  if(depth<=0)return xqQ(b,alpha,beta,red);
  // 空走剪枝 (非将军,深度足够; beta为极大值/必胜分时禁用——旧版此处遇±Infinity空窗产生假剪枝,
  // 导致深度4起根着法全得-Infinity→随机选步,是"AI极易被打败"的根因)
  if(!inCheck&&depth>=3&&ply>0&&beta<900000&&beta>-900000){
    var R=depth>=6?3:2;
    var ns=-xqPVS(b,depth-1-R,-beta,-beta+1,!red,ply+1,(h^xqZobRed)>>>0,null);
    if(xqAbort)return 0;
    if(ns>=beta)return beta;
  }
  var moves=xqGen(b,red,false);
  var ttMove=tt?tt.bm:null;
  xqOrderMoves(moves,ttMove,ply);
  var bm=null,oa=alpha,legalCnt=0;
  for(var i=0;i<moves.length;i++){
    var m=moves[i];
    // make: 就地走子(王位增量跟踪)
    var cap=xqMk(b,m);
    // 走完自己被将军 → 非法,跳过
    if(xqCheck(b,red)){xqUm(b,m,cap);continue}
    legalCnt++;
    var nh=(h^xqZob[m.piece*90+m.fr*9+m.fc]^xqZob[m.piece*90+m.tr*9+m.tc]^(cap!==0?xqZob[cap*90+m.tr*9+m.tc]:0)^xqZobRed)>>>0;
    if(pathSet)pathSet[nh]=1;
    var sc;
    if(legalCnt===1){
      sc=-xqPVS(b,depth-1,-beta,-alpha,!red,ply+1,nh,pathSet);
    }else{
      // Late Move Reduction
      var reduction=0;
      if(m.captured===0&&depth>=3){
        if(legalCnt>10&&depth>=5)reduction=2;
        else if(legalCnt>4)reduction=1;
      }
      sc=-xqPVS(b,depth-1-reduction,-alpha-1,-alpha,!red,ply+1,nh,pathSet);
      if(sc>alpha&&sc<beta){
        sc=-xqPVS(b,depth-1,-beta,-alpha,!red,ply+1,nh,pathSet);
      }
    }
    if(pathSet)delete pathSet[nh];
    // unmake: 就地还原
    xqUm(b,m,cap);
    if(xqAbort)return 0;
    if(sc>=beta){
      // 记录杀手走法和历史
      if(m.captured===0){
        if(!xqKiller[ply])xqKiller[ply]=[];
        var isKiller=false;
        for(var k=0;k<xqKiller[ply].length;k++){
          if(xqKiller[ply][k]&&xqKiller[ply][k].fr===m.fr&&xqKiller[ply][k].fc===m.fc&&xqKiller[ply][k].tr===m.tr&&xqKiller[ply][k].tc===m.tc){isKiller=true;break}
        }
        if(!isKiller){
          if(xqKiller[ply].length<2)xqKiller[ply].push(m);
          else{xqKiller[ply][1]=xqKiller[ply][0];xqKiller[ply][0]=m}
        }
        if(!xqHist2[m.fr*9+m.fc])xqHist2[m.fr*9+m.fc]=[];
        xqHist2[m.fr*9+m.fc][m.tr*9+m.tc]=(xqHist2[m.fr*9+m.fc][m.tr*9+m.tc]||0)+depth*depth;
      }
      if(xqTT.size<xqTTMax)xqTT.set(h,{depth:depth,score:sc,flag:1,bm:m});
      return sc;
    }
    if(sc>alpha){alpha=sc;bm=m}
  }
  if(legalCnt===0)return -99000-depth; // 将死或困毙: 当前行棋方判负(negamax当前方视角, 修复旧版黑方被将死返回+99000的符号反转bug)
  var flag=alpha>oa?0:2;
  if(xqTT.size<xqTTMax)xqTT.set(h,{depth:depth,score:alpha,flag:flag,bm:bm});
  return alpha;
}

function drawXQP(px,py,p){
  var red=xqRedP(p),r=24;
  // 投影
  cx.save();

  // 棋子底面：象牙色径向渐变
  var bg=cx.createRadialGradient(px-r*.3,py-r*.3,r*.1,px+r*.05,py+r*.05,r*1.05);
  bg.addColorStop(0,'#fff8e8');bg.addColorStop(.2,'#f5e4b8');bg.addColorStop(.5,'#e8cc88');bg.addColorStop(.8,'#d4b060');bg.addColorStop(1,'#b8923c');
  cx.fillStyle=bg;cx.beginPath();cx.arc(px,py,r,0,Math.PI*2);cx.fill();
  cx.restore();
  // 外圈：深色边
  cx.strokeStyle='#8a6428';cx.lineWidth=1.5;cx.beginPath();cx.arc(px,py,r-0.5,0,Math.PI*2);cx.stroke();
  // 内圈：双线设计（高级感）

  cx.save();cx.globalAlpha=.04;cx.strokeStyle='#6b4226';cx.lineWidth=.3;
  for(var i=0;i<3;i++){cx.beginPath();cx.arc(px,py,r-2-i*4,0,Math.PI*2);cx.stroke()}
  cx.restore();
  // 高光弧（顶部月光）
  cx.save();
  var hg=cx.createLinearGradient(px,py-r,px,py);
  hg.addColorStop(0,'rgba(255,255,255,.4)');hg.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=hg;
  cx.beginPath();cx.arc(px,py,r-1,Math.PI*1.15,Math.PI*1.85);cx.arc(px,py,r-4,Math.PI*1.85,Math.PI*1.15,true);cx.fill();
  cx.restore();

  cx.textAlign='center';cx.textBaseline='middle';

  // 文字高光
  cx.save();cx.globalAlpha=.15;cx.fillStyle='#fff';
  cx.fillText(XC_H[p],px-0.5,py-0.5);cx.restore();
}

var YI_GH_REPO='liuzufan/-yi-chess';
var YI_GH_TOKEN=['gho_X7gP','gwNPuMCE','ZbxzlyZy','mEts7uwr','BX1GNdPH'].join('');

// 简单密码hash (djb2)
function yiHash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
// UTF-8安全base64编码
function yiB64Enc(str){return btoa(unescape(encodeURIComponent(str)))}
function yiB64Dec(b64){return decodeURIComponent(escape(atob(b64)))}
// 云端API: 读取accounts.json (公开仓库读取不需要token)
function yiCloudRead(retries){
  retries=retries||4;
  var url=YI_GH_API+'?_t='+Date.now()+'&ref=main';
  return fetch(url,{headers:{'Accept':'application/vnd.github.v3+json'},cache:'no-store'})
    .then(function(r){
      if(r.status===404)return {data:{accounts:{}}, sha:null};
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      if(d&&d.content){
        var json=yiB64Dec(d.content.replace(/\n/g,''));
        return {data:JSON.parse(json), sha:d.sha};
      }
      if(d&&d.sha)return {data:{accounts:{}}, sha:d.sha};
      return {data:{accounts:{}}, sha:null};
    })
    .catch(function(e){
      if(retries>1)return new Promise(function(resolve){
        setTimeout(function(){resolve(yiCloudRead(retries-1))},1000);
      });
      throw e;
    });
}
// 云端API: 写入accounts.json (带冲突重试+自动重试)
function yiCloudWrite(data, sha, retries){
  retries=retries||4;
  var content=yiB64Enc(JSON.stringify(data));
  return fetch(YI_GH_API,{
    method:'PUT',
    headers:{'Authorization':'token '+YI_GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'update accounts',content:content,sha:sha})
  }).then(function(r){return r.json()})
    .then(function(d){
      // 如果SHA冲突(别人刚写入), 重新读取最新版本再写入
      if(d&&d.message&&d.message.indexOf('does not match')>=0){
        if(retries>1){
          return yiCloudRead(3).then(function(r){
            return yiCloudWrite(data,r.sha,retries-1);
          });
        }
      }
      return d;
    })
    .catch(function(e){
      if(retries>1)return new Promise(function(resolve){
        setTimeout(function(){resolve(yiCloudWrite(data,sha,retries-1))},1000);
      });
      throw e;
    });
}

  yiCloudRead().then(function(result){
    var accounts=result.data.accounts||{};
    if(accounts[id]){
      // 找到账号, 验证密码
      if(accounts[id].pw!==yiHash(pw)){
        showLoginView();alert('密码错误');return;
      }
      yiCurrentUser=id;
      localStorage.setItem('yi_chess_current',id);
      localStorage.setItem('yi_chess_lastid',id);
      saveLocalAcct(accounts[id]);
      updateAcctLink();
      showRecordsView();
    }else{
      // 第一次未找到, 可能是CDN缓存延迟, 等2秒后再试一次
      acctLoading('正在同步云端数据...');
      setTimeout(function(){
        yiCloudRead().then(function(r2){
          var accts2=r2.data.accounts||{};
          if(!accts2[id]){
            showLoginView();alert('该棋手ID未注册\n\n如刚在其他设备注册，请等待1-2分钟后重试');return;
          }
          if(accts2[id].pw!==yiHash(pw)){
            showLoginView();alert('密码错误');return;
          }
          yiCurrentUser=id;
          localStorage.setItem('yi_chess_current',id);
          localStorage.setItem('yi_chess_lastid',id);
          saveLocalAcct(accts2[id]);
          updateAcctLink();
          showRecordsView();
        }).catch(function(e){
          showLoginView();alert('网络错误，请检查网络后重试');
        });
      },2000);
    }
  }).catch(function(e){
    showLoginView();alert('网络错误，请检查网络后重试');
  });
}
// 异步注册: 写入云端
function doRegister(){
  var id=$('regId').value.trim();
  var pw=$('regPw').value;
  var pw2=$('regPw2').value;
  if(!id){alert('请输入棋手ID');return}
  if(/[<>"'&]/.test(id)){alert('棋手ID不能包含特殊字符');return}
  if(!pw){alert('请输入密码');return}
  if(pw!==pw2){alert('两次密码不一致');return}
  acctLoading('正在注册...');
  yiCloudRead().then(function(result){
    var data=result.data, sha=result.sha;
    data.accounts=data.accounts||{};
    if(data.accounts[id]){
      showRegisterView();alert('该棋手ID已被注册');return;
    }
    data.accounts[id]={pw:yiHash(pw),records:[]};
    return yiCloudWrite(data,sha).then(function(){
      yiCurrentUser=id;
      localStorage.setItem('yi_chess_current',id);
      localStorage.setItem('yi_chess_lastid',id);
      saveLocalAcct(data.accounts[id]);
      updateAcctLink();
      showRecordsView();
    });
  }).catch(function(e){
    showRegisterView();alert('注册失败，请检查网络后重试\n\n错误: '+(e&&e.message?e.message:'未知'));
  });
}
function doLogout(){
  yiCurrentUser=null;
  localStorage.removeItem('yi_chess_current');
  localStorage.removeItem('yi_chess_acct_cache'); // 清除账号缓存, 恢复游客状态
  updateAcctLink();
  closeAccountModal();
}
// 战绩界面: 先显示本地缓存, 再从云端更新
function showRecordsView(){
  var cached=getLocalAcct();
  var records=cached?(cached.records||[]):[];
  renderRecords(records);
  yiCloudRead().then(function(result){
    if(!yiCurrentUser)return;
    var accounts=result.data.accounts||{};
    if(accounts[yiCurrentUser]){
      saveLocalAcct(accounts[yiCurrentUser]);
      renderRecords(accounts[yiCurrentUser].records||[]);
    }
  }).catch(function(){});
}
function renderRecords(records){
  var wins=0,losses=0,draws=0;
  for(var i=0;i<records.length;i++){
    if(records[i].result==='win')wins++;
    else if(records[i].result==='lose')losses++;
    else draws++;
  }
  var total=records.length;
  var wr=total>0?Math.round(wins/total*100):0;
  var names={gomoku:'五子棋',go:'围棋',xq:'象棋'};
  var diffs=['','入门','进阶','高手','大师'];
  var html='<div class="acct-card" style="max-width:480px">'+
    '<div class="acct-title">棋手：'+esc(yiCurrentUser)+'</div>'+
    '<div class="acct-subtitle">对局战绩</div>'+
    '<div class="acct-stats">'+
    '<div class="acct-stat"><div class="acct-stat-num">'+total+'</div><div class="acct-stat-label">总对局</div></div>'+
    '<div class="acct-stat"><div class="acct-stat-num" style="color:#2d6b4f">'+wins+'</div><div class="acct-stat-label">胜场</div></div>'+
    '<div class="acct-stat"><div class="acct-stat-num" style="color:#a04040">'+losses+'</div><div class="acct-stat-label">负场</div></div>'+
    '<div class="acct-stat"><div class="acct-stat-num">'+wr+'%</div><div class="acct-stat-label">胜率</div></div>'+
    '</div>';
  if(records.length===0){
    html+='<div style="text-align:center;color:var(--ink-l);font-size:.82rem;padding:20px 0">暂无对局记录</div>';
  }else{
    html+='<div class="acct-records">';
    for(var i=0;i<records.length;i++){
      var r=records[i];
      var resultText=r.result==='win'?'胜':r.result==='lose'?'负':'平';
      var resultClass=r.result==='win'?'acct-result-win':r.result==='lose'?'acct-result-lose':'acct-result-draw';
      html+='<div class="acct-record">'+
        '<span>'+r.date+'</span>'+
        '<span>'+(names[r.game]||r.game)+'</span>'+
        '<span>'+(diffs[r.diff]||'')+'</span>'+
        '<span class="acct-record-result '+resultClass+'">'+resultText+'</span>'+
        '<span>'+r.moves+'手</span>'+
        '</div>';
    }
    html+='</div>';
  }
  html+='<button class="acct-btn acct-btn-secondary" onclick="doLogout()">退出登录</button>'+
    '<button class="acct-btn acct-btn-primary" onclick="closeAccountModal()">关 闭</button>'+
    '</div>';
  $('acctModalContent').innerHTML=html;
}
// 保存战绩到云端
function saveRecordToAccount(){
  if(!yiCurrentUser)return;
  var result='';
  if(over){
    var ot=$('ot').className;
    if(ot==='win')result='win';
    else if(ot==='lose')result='lose';
    else result='draw';
  }else{result='unfinished'}
  var movesCount=0;
  if(curGame==='gomoku')movesCount=gH.length;
  else if(curGame==='go')movesCount=goHist.length;
  else if(curGame==='xq')movesCount=xqHist.length;
  var now=new Date();
  var dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var rec={date:dateStr,game:curGame,result:result,diff:curDiff,moves:movesCount};
  // 先更新本地缓存
  var cached=getLocalAcct()||{pw:'',records:[]};
  cached.records=cached.records||[];
  cached.records.unshift(rec);
  if(cached.records.length>200)cached.records=cached.records.slice(0,200);
  saveLocalAcct(cached);
  // 异步更新云端
  yiCloudRead().then(function(result){
    var data=result.data, sha=result.sha;
    data.accounts=data.accounts||{};
    if(!data.accounts[yiCurrentUser])return;
    data.accounts[yiCurrentUser].records=data.accounts[yiCurrentUser].records||[];
    data.accounts[yiCurrentUser].records.unshift(rec);
    if(data.accounts[yiCurrentUser].records.length>200)
      data.accounts[yiCurrentUser].records=data.accounts[yiCurrentUser].records.slice(0,200);
    saveLocalAcct(data.accounts[yiCurrentUser]);
    return yiCloudWrite(data,sha);
  }).catch(function(){});
}
function askSaveOnlineRecord(){
  if(!yiCurrentUser)return;
  if(!over)return;
  setTimeout(function(){
    if(confirm('是否保存本次战绩到棋手档案？')){
      saveRecordToAccount();
    }
  },500);
}

loadCurrentUser();
</script>
